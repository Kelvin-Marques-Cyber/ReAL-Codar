name: Release

# Veja docs/PACKAGING.md antes de criar uma tag v*.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  pacotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Confere tag, changelog e versões de todos os pacotes
        run: python packaging/check_versions.py --tag "$GITHUB_REF_NAME"
      - name: Testes antes de publicar
        run: |
          pip install -e ".[dev,studio]" build
          pytest
      - name: Instala o nfpm
        run: |
          curl -fsSL -o /tmp/nfpm.tgz https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz
          sudo tar xzf /tmp/nfpm.tgz -C /usr/local/bin nfpm
      - name: Extensão do VS Code
        run: cd clients/vscode && npm ci && npm run compile
      - run: packaging/build.sh
      - run: packaging/test-containers.sh debian:12 ubuntu:22.04 ubuntu:24.04 fedora:latest opensuse/tumbleweed opensuse/leap:15.6 opensuse/leap:16.0 alpine:latest archlinux:latest
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.apk
            dist/*.pkg.tar.zst
            dist/*.whl
            dist/*.tar.gz
            dist/*.zip
            dist/codar.vsix
            dist/SHA256SUMS
            dist/RELEASE.json
