[[pattern]]
id = "util.date_diff"
title = "Diferença entre datas (dias, idade)"
keywords = "diferenca entre datas dias idade anos intervalo data diff calcular idade nascimento"
require = ["diferenca", "diff", "idade", "age", "intervalo"]
tags = ["datetime"]

[pattern.code]
python = '''
from datetime import date


def dias_entre(inicio: date, fim: date) -> int:
    return (fim - inicio).days


def idade(nascimento: date, hoje: date | None = None) -> int:
    hoje = hoje or date.today()
    return hoje.year - nascimento.year - ((hoje.month, hoje.day) < (nascimento.month, nascimento.day))
'''
javascript = '''
const DIA_MS = 86_400_000;

function diasEntre(inicio, fim) {
  // Date.UTC evita erros de 1 dia em mudanças de horário de verão.
  const utc = (d) => Date.UTC(d.getFullYear(), d.getMonth(), d.getDate());
  return Math.round((utc(fim) - utc(inicio)) / DIA_MS);
}

function idade(nascimento, hoje = new Date()) {
  let anos = hoje.getFullYear() - nascimento.getFullYear();
  const m = hoje.getMonth() - nascimento.getMonth();
  if (m < 0 || (m === 0 && hoje.getDate() < nascimento.getDate())) anos--;
  return anos;
}
'''
go = '''
import "time"

func diasEntre(inicio, fim time.Time) int {
	return int(fim.Sub(inicio).Hours() / 24)
}

func idade(nascimento, hoje time.Time) int {
	anos := hoje.Year() - nascimento.Year()
	if hoje.YearDay() < nascimento.YearDay() {
		anos--
	}
	return anos
}
'''
csharp = '''
static int DiasEntre(DateOnly inicio, DateOnly fim) => fim.DayNumber - inicio.DayNumber;

static int Idade(DateOnly nascimento, DateOnly hoje)
{
    int anos = hoje.Year - nascimento.Year;
    if (hoje < nascimento.AddYears(anos)) anos--;
    return anos;
}
'''
powershell = '''
$dias = (New-TimeSpan -Start (Get-Date '2026-01-01') -End (Get-Date '2026-10-02')).Days
'''

[pattern.test]
python = '''
from datetime import date
assert dias_entre(date(2026, 1, 1), date(2026, 3, 1)) == 59 and idade(date(2000, 10, 3), date(2026, 10, 2)) == 25
'''
javascript = '''
if (diasEntre(new Date(2026, 0, 1), new Date(2026, 2, 1)) !== 59 || idade(new Date(2000, 9, 3), new Date(2026, 9, 2)) !== 25) throw new Error("falhou");
'''
powershell = '''
if ($dias -ne 274) { throw "falhou: $dias" }
'''

