import re

_EMAIL = re.compile(r"[\w.+-]+@[\w-]+(?:\.[\w-]+)+")


def extrair_emails(texto: str) -> list[str]:
    return list(dict.fromkeys(_EMAIL.findall(texto)))


def email_valido(email: str) -> bool:
