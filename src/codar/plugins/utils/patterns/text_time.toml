'''

[[pattern]]
id = "util.random"
title = "Número aleatório num intervalo e embaralhar"
keywords = "numero aleatorio random intervalo sortear embaralhar shuffle escolher item aleatorio"
require = ["aleatorio", "random", "sortear", "embaralhar", "shuffle"]
tags = ["random"]

[pattern.code]
python = '''
import random

n = random.randint(1, 100)          # inclusive nas duas pontas
item = random.choice(["a", "b", "c"])
cartas = list(range(10))
random.shuffle(cartas)               # no lugar
# Para tokens, senhas ou sorteios com valor: use o módulo secrets (criptográfico).
'''
javascript = '''
// Inteiro em [min, max]. Para segurança use crypto.getRandomValues.
const aleatorio = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

function embaralhar(itens) {
  const a = [...itens];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1)); // Fisher-Yates: distribuição uniforme
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
'''
go = '''
import "math/rand/v2"

func aleatorio(min, max int) int {
	return min + rand.IntN(max-min+1)
}

func embaralhar[T any](itens []T) {
	rand.Shuffle(len(itens), func(i, j int) { itens[i], itens[j] = itens[j], itens[i] })
}
'''
csharp = '''
int n = Random.Shared.Next(1, 101); // limite superior exclusivo
var cartas = Enumerable.Range(0, 10).ToArray();
Random.Shared.Shuffle(cartas);      // .NET 8+
'''
powershell = '''
$n = Get-Random -Minimum 1 -Maximum 101   # Maximum é exclusivo
$cartas = 0..9 | Get-Random -Shuffle      # PowerShell 7.1+
'''
bash = '''
n=$(( RANDOM % 100 + 1 ))      # 1..100 (RANDOM vai até 32767)
shuf -i 1-100 -n 1             # alternativa com coreutils
'''

[pattern.test]
python = '''
assert 1 <= n <= 100 and sorted(cartas) == list(range(10))
'''
javascript = '''
const e = embaralhar([1, 2, 3, 4]);
if (e.length !== 4 || [...e].sort().join() !== "1,2,3,4") throw new Error("falhou");
const x = aleatorio(1, 6); if (x < 1 || x > 6) throw new Error("fora do intervalo");
'''

[[pattern]]
id = "util.slugify"
title = "Slugify (texto para URL amigável)"
keywords = "slug slugify url amigavel remover acentos texto para url permalink"
require = ["slug", "slugify", "permalink"]
tags = ["text"]

[pattern.code]
python = '''
import re
import unicodedata


def slugify(texto: str) -> str:
    sem_acento = unicodedata.normalize("NFKD", texto).encode("ascii", "ignore").decode()
    return re.sub(r"[^a-z0-9]+", "-", sem_acento.lower()).strip("-")
'''
javascript = '''
const slugify = (texto) =>
  texto.normalize("NFKD").replace(/\p{Diacritic}/gu, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
'''
go = '''
import (
	"strings"
	"unicode"

	"golang.org/x/text/runes"
	"golang.org/x/text/transform"
	"golang.org/x/text/unicode/norm"
)

func slugify(texto string) string {
	t := transform.Chain(norm.NFD, runes.Remove(runes.In(unicode.Mn)), norm.NFC)
	semAcento, _, _ := transform.String(t, strings.ToLower(texto))
	var b strings.Builder
	hifen := false
	for _, r := range semAcento {
		if r < 128 && (unicode.IsLetter(r) || unicode.IsDigit(r)) {
			b.WriteRune(r)
			hifen = false
		} else if !hifen && b.Len() > 0 {
			b.WriteByte('-')
			hifen = true
		}
	}
	return strings.TrimSuffix(b.String(), "-")
}
'''
powershell = '''
function ConvertTo-Slug {
    param([Parameter(Mandatory, ValueFromPipeline)][string]$Texto)
    process {
        $normal = $Texto.Normalize([Text.NormalizationForm]::FormD)
        $semAcento = -join ($normal.ToCharArray() | Where-Object {
                [Globalization.CharUnicodeInfo]::GetUnicodeCategory($_) -ne 'NonSpacingMark' })
        ($semAcento.ToLowerInvariant() -replace '[^a-z0-9]+', '-').Trim('-')
    }
}
'''

[pattern.test]
python = '''
assert slugify("Olá, Mundo! Ação 2026") == "ola-mundo-acao-2026"
'''
javascript = '''
if (slugify("Olá, Mundo! Ação 2026") !== "ola-mundo-acao-2026") throw new Error("falhou");
'''
powershell = '''
if (('Olá, Mundo! Ação 2026' | ConvertTo-Slug) -ne 'ola-mundo-acao-2026') { throw 'falhou' }
'''

