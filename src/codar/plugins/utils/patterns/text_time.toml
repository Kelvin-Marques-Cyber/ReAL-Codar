title = "Converter texto em data (parse) e formatar"
keywords = "converter texto data parse string para data formato dd/mm/yyyy strptime formatar"
require = ["parse", "converter", "convert", "formatar", "format"]
tags = ["datetime"]

slots = { text = "02/10/2026" }
[pattern.code]
python = '''
from datetime import datetime

data = datetime.strptime("{{text}}", "%d/%m/%Y")  # ValueError se o formato não bater
iso = datetime.fromisoformat("2026-10-02T13:17:05+00:00")
print(data.strftime("%Y-%m-%d"))
'''
javascript = '''
function parseDataBR(texto) {
  const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(texto);
  if (!m) throw new Error(`data inválida: ${texto}`);
  const [, d, mes, a] = m.map(Number);
  const data = new Date(a, mes - 1, d);
  if (data.getMonth() !== mes - 1) throw new Error(`data inexistente: ${texto}`); // ex.: 31/02
  return data;
}
'''
go = '''
import "time"

func parseDataBR(texto string) (time.Time, error) {
	// Layout de referência do Go: 02/01/2006 = dd/mm/aaaa
	return time.Parse("02/01/2006", texto)
}
'''
csharp = '''
var data = DateTime.ParseExact("{{text}}", "dd/MM/yyyy", System.Globalization.CultureInfo.InvariantCulture);
'''
powershell = '''
$data = [datetime]::ParseExact('{{text}}', 'dd/MM/yyyy', [cultureinfo]::InvariantCulture)
$data.ToString('yyyy-MM-dd')
'''

[pattern.test]
