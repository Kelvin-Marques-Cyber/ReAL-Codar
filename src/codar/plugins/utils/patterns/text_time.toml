[pattern.code]
python = '''
import time
from contextlib import contextmanager


@contextmanager
def cronometro(rotulo: str = "bloco"):
    """with cronometro("consulta"): ...  — perf_counter é monotônico e de alta resolução."""
    inicio = time.perf_counter()
    try:
