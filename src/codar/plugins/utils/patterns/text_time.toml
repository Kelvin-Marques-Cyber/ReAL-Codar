[[pattern]]
id = "util.json_pretty"
title = "Formatar (pretty print) JSON"
keywords = "formatar json pretty print indentar bonito legivel"
require = ["json"]
tags = ["json"]

slots = { path = "dados.json" }
[pattern.code]
python = '''
import json

texto = json.dumps(dados, ensure_ascii=False, indent=2, sort_keys=True)
'''
javascript = '''
const texto = JSON.stringify(dados, null, 2);
'''
go = '''
import "encoding/json"

func jsonBonito(v any) (string, error) {
	b, err := json.MarshalIndent(v, "", "  ")
	return string(b), err
}
'''
powershell = '''
$texto = $dados | ConvertTo-Json -Depth 10
'''
bash = '''
jq . "{{path}}"          # ou: python3 -m json.tool "{{path}}"
'''

[pattern.test]
python_setup = '''
dados = {"b": 1, "a": "ç"}
'''
python = '''
assert texto == '{\n  "a": "ç",\n  "b": 1\n}'
'''

[[pattern]]
id = "util.temperature"
title = "Conversão de temperatura (Celsius, Fahrenheit, Kelvin)"
keywords = "converter temperatura celsius fahrenheit kelvin graus"
require = ["temperatura", "temperature", "celsius", "fahrenheit", "kelvin"]
tags = ["math"]

[pattern.code]
python = '''
def celsius_para_fahrenheit(c: float) -> float:
    return c * 9 / 5 + 32


def fahrenheit_para_celsius(f: float) -> float:
    return (f - 32) * 5 / 9


def celsius_para_kelvin(c: float) -> float:
    if c < -273.15:
        raise ValueError("abaixo do zero absoluto")
    return c + 273.15
'''
javascript = '''
const celsiusParaFahrenheit = (c) => (c * 9) / 5 + 32;
const fahrenheitParaCelsius = (f) => ((f - 32) * 5) / 9;
'''
go = '''
func celsiusParaFahrenheit(c float64) float64 { return c*9/5 + 32 }
func fahrenheitParaCelsius(f float64) float64 { return (f - 32) * 5 / 9 }
'''
powershell = '''
function ConvertTo-Fahrenheit([double]$Celsius) { $Celsius * 9 / 5 + 32 }
function ConvertTo-Celsius([double]$Fahrenheit) { ($Fahrenheit - 32) * 5 / 9 }
'''

[pattern.test]
python = '''
assert celsius_para_fahrenheit(100) == 212 and fahrenheit_para_celsius(-40) == -40 and celsius_para_kelvin(0) == 273.15
'''
javascript = '''
if (celsiusParaFahrenheit(0) !== 32 || fahrenheitParaCelsius(212) !== 100) throw new Error("falhou");
'''
powershell = '''
if ((ConvertTo-Fahrenheit 100) -ne 212) { throw 'falhou' }
'''

[[pattern]]
id = "util.digits"
title = "Somar e manipular dígitos de um número"
keywords = "soma digitos somar digitos numero algarismos inverter numero digito"
require = ["digitos", "digits", "algarismos"]
tags = ["math"]

[pattern.code]
python = '''
def soma_digitos(n: int) -> int:
    return sum(int(d) for d in str(abs(n)))


def inverter_numero(n: int) -> int:
    sinal = -1 if n < 0 else 1
    return sinal * int(str(abs(n))[::-1])
'''
javascript = '''
const somaDigitos = (n) => [...String(Math.abs(n))].reduce((s, d) => s + Number(d), 0);
'''
go = '''
func somaDigitos(n int) int {
	if n < 0 {
		n = -n
	}
	soma := 0
	for ; n > 0; n /= 10 {
		soma += n % 10
	}
	return soma
}
'''

[pattern.test]
python = '''
assert soma_digitos(1234) == 10 and soma_digitos(-56) == 11 and soma_digitos(0) == 0 and inverter_numero(-120) == -21
'''
javascript = '''
if (somaDigitos(1234) !== 10 || somaDigitos(-56) !== 11) throw new Error("falhou");
'''

[[pattern]]
id = "util.truncate"
title = "Truncar texto com reticências"
keywords = "truncar texto reticencias limitar tamanho resumo cortar string"
require = ["truncar", "truncate", "cortar", "reticencias"]
tags = ["text"]

[pattern.code]
python = '''
def truncar(texto: str, limite: int, sufixo: str = "…") -> str:
    """Corta no último espaço antes do limite para não quebrar palavras."""
    if len(texto) <= limite:
        return texto
    corte = texto[: limite - len(sufixo)].rsplit(" ", 1)[0]
    return corte.rstrip(" ,.;:") + sufixo
'''
javascript = '''
function truncar(texto, limite, sufixo = "…") {
  if (texto.length <= limite) return texto;
  const corte = texto.slice(0, limite - sufixo.length);
  const espaco = corte.lastIndexOf(" ");
  return (espaco > 0 ? corte.slice(0, espaco) : corte).replace(/[ ,.;:]+$/, "") + sufixo;
}
'''

[pattern.test]
python = '''
assert truncar("O rato roeu a roupa do rei de Roma", 15) == "O rato roeu a…" and truncar("curto", 10) == "curto"
'''
javascript = '''
if (truncar("O rato roeu a roupa do rei de Roma", 15) !== "O rato roeu a…") throw new Error("falhou");
'''
