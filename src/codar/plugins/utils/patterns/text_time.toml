# Texto, datas, identificadores e codificação. Datas sempre com fuso explícito (UTC) para evitar bugs de horário de verão.

[[pattern]]
id = "util.uuid"
title = "Gerar UUID"
keywords = "uuid guid identificador unico gerar id aleatorio v4 v7"
require = ["uuid", "guid"]
tags = ["id"]

[pattern.code]
python = '''
import uuid

identificador = str(uuid.uuid4())
'''
javascript = '''
// Disponível no Node 19+ e em navegadores modernos (globalThis.crypto).
const identificador = crypto.randomUUID();
'''
typescript = '''
const identificador: string = crypto.randomUUID();
'''
go = '''
import (
	"crypto/rand"
	"fmt"
)

// novoUUID gera um UUID v4 sem dependências externas (ou use github.com/google/uuid).
func novoUUID() (string, error) {
	var b [16]byte
	if _, err := rand.Read(b[:]); err != nil {
		return "", err
	}
	b[6] = (b[6] & 0x0f) | 0x40 // versão 4
	b[8] = (b[8] & 0x3f) | 0x80 // variante RFC 4122
	return fmt.Sprintf("%x-%x-%x-%x-%x", b[0:4], b[4:6], b[6:8], b[8:10], b[10:16]), nil
}
'''
java = '''
String identificador = java.util.UUID.randomUUID().toString();
'''
csharp = '''
// .NET 9+: Guid.CreateVersion7() gera ids ordenáveis por tempo (bons para chaves de banco).
var identificador = Guid.NewGuid().ToString();
'''
powershell = '''
$identificador = [guid]::NewGuid().ToString()
'''
bash = '''
identificador="$(cat /proc/sys/kernel/random/uuid 2>/dev/null || uuidgen)"
'''
rust = '''
// Cargo.toml: uuid = { version = "1", features = ["v4"] }
let identificador = uuid::Uuid::new_v4().to_string();
'''

[pattern.test]
python = '''
assert len(identificador) == 36 and identificador.count("-") == 4
'''
javascript = '''
if (!/^[0-9a-f-]{36}$/.test(identificador)) throw new Error("falhou");
'''
powershell = '''
if ($identificador.Length -ne 36) { throw 'falhou' }
'''

