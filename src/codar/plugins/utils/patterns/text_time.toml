[[pattern]]
id = "util.case_convert"
title = "Converter entre camelCase, snake_case e kebab-case"
keywords = "converter camelcase snake case kebab case pascal maiusculas nomes identificadores"
require = ["camelcase", "snake", "kebab", "pascal", "case"]
tags = ["text"]

[pattern.code]
python = '''
import re


def palavras(texto: str) -> list[str]:
    texto = re.sub(r"([a-z0-9])([A-Z])", r"\1 \2", texto)
    return [p.lower() for p in re.split(r"[\s_\-]+", texto) if p]


def snake_case(texto: str) -> str:
    return "_".join(palavras(texto))


def camel_case(texto: str) -> str:
    p = palavras(texto)
    return p[0] + "".join(x.capitalize() for x in p[1:]) if p else ""


def kebab_case(texto: str) -> str:
    return "-".join(palavras(texto))
'''
javascript = '''
const palavras = (t) => t.replace(/([a-z0-9])([A-Z])/g, "$1 $2").split(/[\s_-]+/).filter(Boolean).map((p) => p.toLowerCase());
const snakeCase = (t) => palavras(t).join("_");
const kebabCase = (t) => palavras(t).join("-");
const camelCase = (t) => palavras(t).map((p, i) => (i ? p[0].toUpperCase() + p.slice(1) : p)).join("");
'''

[pattern.test]
python = '''
