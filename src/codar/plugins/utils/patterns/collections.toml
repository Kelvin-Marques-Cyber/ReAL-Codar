[[pattern]]
id = "util.stats"
title = "Estatística básica (média, mediana, moda, desvio)"
keywords = "media mediana moda desvio padrao estatistica mean median mode average variancia"
require = ["media", "mediana", "moda", "mean", "median", "average", "desvio", "estatistica"]
tags = ["math"]

[pattern.code]
python = '''
import statistics


def resumo(numeros: list[float]) -> dict:
    """Estatísticas descritivas; lista vazia devolve zeros em vez de lançar StatisticsError."""
    if not numeros:
        return {"n": 0, "media": 0, "mediana": 0, "moda": None, "desvio": 0, "min": None, "max": None}
    return {
        "n": len(numeros),
        "media": statistics.fmean(numeros),
        "mediana": statistics.median(numeros),
        "moda": statistics.mode(numeros),
        "desvio": statistics.stdev(numeros) if len(numeros) > 1 else 0.0,
        "min": min(numeros),
        "max": max(numeros),
    }


def media(numeros: list[float]) -> float:
    return statistics.fmean(numeros) if numeros else 0
'''
javascript = '''
function resumo(numeros) {
  const n = numeros.length;
  if (!n) return { n: 0, media: 0, mediana: 0, desvio: 0 };
  const media = numeros.reduce((a, b) => a + b, 0) / n;
  const ord = numeros.toSorted((a, b) => a - b);
  const mediana = n % 2 ? ord[(n - 1) / 2] : (ord[n / 2 - 1] + ord[n / 2]) / 2;
  const variancia = n > 1 ? numeros.reduce((s, x) => s + (x - media) ** 2, 0) / (n - 1) : 0;
  return { n, media, mediana, desvio: Math.sqrt(variancia), min: ord[0], max: ord[n - 1] };
}
'''
go = '''
import "slices"

func media(numeros []float64) float64 {
	if len(numeros) == 0 {
		return 0
	}
	soma := 0.0
	for _, x := range numeros {
		soma += x
	}
	return soma / float64(len(numeros))
}

func mediana(numeros []float64) float64 {
	n := len(numeros)
	if n == 0 {
		return 0
	}
	ord := slices.Clone(numeros)
	slices.Sort(ord)
	if n%2 == 1 {
		return ord[n/2]
	}
	return (ord[n/2-1] + ord[n/2]) / 2
}
'''
csharp = '''
static (double Media, double Mediana) Resumo(IReadOnlyList<double> numeros)
{
    if (numeros.Count == 0) return (0, 0);
    var ord = numeros.Order().ToArray();
    int n = ord.Length;
    double mediana = n % 2 == 1 ? ord[n / 2] : (ord[n / 2 - 1] + ord[n / 2]) / 2;
    return (numeros.Average(), mediana);
}
'''
powershell = '''
$m = $numeros | Measure-Object -Average -Sum -Minimum -Maximum -StandardDeviation
"Média: {0:N2}  Soma: {1}  Mín: {2}  Máx: {3}  Desvio: {4:N2}" -f $m.Average, $m.Sum, $m.Minimum, $m.Maximum, $m.StandardDeviation
'''

[pattern.test]
python = '''
r = resumo([1, 2, 2, 3, 4])
assert r["media"] == 2.4 and r["mediana"] == 2 and r["moda"] == 2 and media([]) == 0 and media([1, 2, 3, 4]) == 2.5
'''
javascript = '''
const r = resumo([1, 2, 3, 4]);
if (r.media !== 2.5 || r.mediana !== 2.5 || resumo([]).n !== 0) throw new Error("falhou");
'''

[[pattern]]
id = "util.second_largest"
title = "Segundo maior valor distinto"
keywords = "segundo maior valor distinto lista second largest maximo"
require = ["segundo", "second"]
tags = ["collections"]

[pattern.code]
python = '''
def segundo_maior(itens):
    """Segundo maior valor distinto em uma passada, ou None."""
    primeiro = segundo = None
    for x in itens:
        if primeiro is None or x > primeiro:
            primeiro, segundo = x, primeiro
        elif x != primeiro and (segundo is None or x > segundo):
            segundo = x
    return segundo
'''
javascript = '''
function segundoMaior(itens) {
  const distintos = [...new Set(itens)].sort((a, b) => b - a);
  return distintos.length > 1 ? distintos[1] : null;
}
'''

[pattern.test]
python = '''
assert segundo_maior([5, 1, 5, 3]) == 3 and segundo_maior([2]) is None and segundo_maior([4, 4]) is None and segundo_maior([-1, -5, -3]) == -3
'''
javascript = '''
if (segundoMaior([5, 1, 5, 3]) !== 3 || segundoMaior([4, 4]) !== null) throw new Error("falhou");
'''

