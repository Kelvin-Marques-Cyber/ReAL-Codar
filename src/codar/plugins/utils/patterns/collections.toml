[[pattern]]
id = "util.merge_dicts"
title = "Mesclar dicionários/objetos (raso e profundo)"
keywords = "mesclar merge combinar dicionarios objetos mapas deep merge sobrescrever configuracao"
require = ["mesclar", "merge", "combinar"]
tags = ["collections"]

[pattern.code]
python = '''
def mesclar(*dicts: dict) -> dict:
    """Mescla raso: os da direita vencem (Python 3.9+: a | b)."""
    saida: dict = {}
    for d in dicts:
        saida |= d
    return saida


def mesclar_profundo(base: dict, extra: dict) -> dict:
    """Mescla recursiva sem alterar as entradas."""
    saida = dict(base)
    for k, v in extra.items():
        if isinstance(v, dict) and isinstance(saida.get(k), dict):
            saida[k] = mesclar_profundo(saida[k], v)
        else:
            saida[k] = v
    return saida
'''
javascript = '''
const mesclar = (...objs) => Object.assign({}, ...objs);

function mesclarProfundo(base, extra) {
  const saida = { ...base };
  for (const [k, v] of Object.entries(extra)) {
    const ehObj = (x) => x && typeof x === "object" && !Array.isArray(x);
    saida[k] = ehObj(v) && ehObj(saida[k]) ? mesclarProfundo(saida[k], v) : v;
  }
  return saida;
}
'''
go = '''
import "maps"

func mesclar[K comparable, V any](mapas ...map[K]V) map[K]V {
	saida := map[K]V{}
	for _, m := range mapas {
		maps.Copy(saida, m)
	}
	return saida
}
'''
powershell = '''
function Merge-Hashtable {
    param([hashtable]$Base, [hashtable]$Extra)
    $saida = $Base.Clone()
    foreach ($k in $Extra.Keys) {
        if ($saida[$k] -is [hashtable] -and $Extra[$k] -is [hashtable]) { $saida[$k] = Merge-Hashtable $saida[$k] $Extra[$k] }
        else { $saida[$k] = $Extra[$k] }
    }
    $saida
}
'''

[pattern.test]
python = '''
assert mesclar({"a": 1}, {"a": 2, "b": 3}) == {"a": 2, "b": 3}
assert mesclar_profundo({"db": {"host": "x", "port": 1}}, {"db": {"port": 2}}) == {"db": {"host": "x", "port": 2}}
'''
javascript = '''
if (mesclarProfundo({ db: { host: "x", port: 1 } }, { db: { port: 2 } }).db.host !== "x") throw new Error("falhou");
'''
powershell = '''
$r = Merge-Hashtable @{ db = @{ host = 'x'; port = 1 } } @{ db = @{ port = 2 } }
if ($r.db.host -ne 'x' -or $r.db.port -ne 2) { throw 'falhou' }
'''
