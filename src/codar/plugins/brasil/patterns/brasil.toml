# Utilidades brasileiras. Regras conferidas com a documentação oficial (Receita Federal, Banco Central).

[[pattern]]
id = "br.cpf"
title = "Validar e formatar CPF"
keywords = "cpf validar validacao digito verificador formatar mascara brasileiro documento"
require = ["cpf"]
tags = ["brasil", "validation"]

[pattern.code]
python = '''
import re


def _dv(digitos: str, peso_inicial: int) -> str:
    soma = sum(int(d) * p for d, p in zip(digitos, range(peso_inicial, 1, -1)))
    resto = (soma * 10) % 11
    return "0" if resto == 10 else str(resto)


def validar_cpf(cpf: str) -> bool:
    """Aceita com ou sem pontuação. Rejeita sequências repetidas (111.111.111-11)."""
    d = re.sub(r"\D", "", cpf)
    if len(d) != 11 or d == d[0] * 11:
        return False
    return d[9] == _dv(d[:9], 10) and d[10] == _dv(d[:10], 11)


def formatar_cpf(cpf: str) -> str:
    d = re.sub(r"\D", "", cpf)
    return f"{d[:3]}.{d[3:6]}.{d[6:9]}-{d[9:]}"
'''
javascript = '''
function validarCpf(cpf) {
  const d = String(cpf).replace(/\D/g, "");
  if (d.length !== 11 || /^(\d)\1{10}$/.test(d)) return false;
  const dv = (n) => {
    let soma = 0;
    for (let i = 0; i < n; i++) soma += Number(d[i]) * (n + 1 - i);
    const resto = (soma * 10) % 11;
    return resto === 10 ? 0 : resto;
  };
  return dv(9) === Number(d[9]) && dv(10) === Number(d[10]);
}

const formatarCpf = (cpf) => String(cpf).replace(/\D/g, "").replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, "$1.$2.$3-$4");
'''
typescript = '''
export function validarCpf(cpf: string): boolean {
  const d = cpf.replace(/\D/g, "");
  if (d.length !== 11 || /^(\d)\1{10}$/.test(d)) return false;
  const dv = (n: number): number => {
    let soma = 0;
    for (let i = 0; i < n; i++) soma += Number(d[i]) * (n + 1 - i);
    const resto = (soma * 10) % 11;
    return resto === 10 ? 0 : resto;
  };
  return dv(9) === Number(d[9]) && dv(10) === Number(d[10]);
}
'''
go = '''
import "strings"

func validarCPF(cpf string) bool {
	var d []int
	for _, r := range cpf {
		if r >= '0' && r <= '9' {
			d = append(d, int(r-'0'))
		}
	}
	if len(d) != 11 || strings.Count(cpf, string(cpf[0])) == len(cpf) && len(cpf) == 11 {
		return false
	}
	iguais := true
	for _, x := range d[1:] {
		if x != d[0] {
			iguais = false
		}
	}
	if iguais {
		return false
	}
	dv := func(n int) int {
		soma := 0
		for i := 0; i < n; i++ {
			soma += d[i] * (n + 1 - i)
		}
		r := soma * 10 % 11
		if r == 10 {
			return 0
		}
		return r
	}
	return dv(9) == d[9] && dv(10) == d[10]
}
'''
java = '''
static boolean validarCpf(String cpf) {
    String d = cpf.replaceAll("\\D", "");
    if (d.length() != 11 || d.chars().distinct().count() == 1) {
        return false;
    }
    for (int n = 9; n <= 10; n++) {
        int soma = 0;
        for (int i = 0; i < n; i++) {
            soma += (d.charAt(i) - '0') * (n + 1 - i);
        }
        int resto = soma * 10 % 11;
        if ((resto == 10 ? 0 : resto) != d.charAt(n) - '0') {
            return false;
        }
    }
    return true;
}
'''
