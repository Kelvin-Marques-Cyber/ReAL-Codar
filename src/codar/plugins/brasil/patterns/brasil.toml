assert not validar_cnpj("11.222.333/0001-80") and not validar_cnpj("00.000.000/0000-00") and formatar_cnpj("11222333000181") == "11.222.333/0001-81"
'''
javascript = '''
if (!validarCnpj("11.222.333/0001-81") || !validarCnpj("12.ABC.345/01DE-35") || validarCnpj("11.222.333/0001-80")) throw new Error("falhou");
'''

[[pattern]]
id = "br.cep"
title = "Consultar CEP (ViaCEP)"
keywords = "cep consultar endereco viacep buscar logradouro bairro cidade uf correios"
require = ["cep", "viacep"]
tags = ["brasil", "http"]

[pattern.code]
python = '''
import json
import re
import urllib.request


def consultar_cep(cep: str, timeout: float = 5.0) -> dict | None:
    """Endereço do CEP via ViaCEP, ou None se não existir. Requer rede."""
    digitos = re.sub(r"\D", "", cep)
    if len(digitos) != 8:
        raise ValueError("CEP deve ter 8 dígitos")
    with urllib.request.urlopen(f"https://viacep.com.br/ws/{digitos}/json/", timeout=timeout) as resp:
        dados = json.load(resp)
    return None if dados.get("erro") else dados
'''
javascript = '''
async function consultarCep(cep) {
  const digitos = String(cep).replace(/\D/g, "");
  if (digitos.length !== 8) throw new Error("CEP deve ter 8 dígitos");
  const resp = await fetch(`https://viacep.com.br/ws/${digitos}/json/`, { signal: AbortSignal.timeout(5000) });
  if (!resp.ok) throw new Error(`ViaCEP respondeu ${resp.status}`);
  const dados = await resp.json();
  return dados.erro ? null : dados;
}
'''
go = '''
import (
	"encoding/json"
	"fmt"
	"net/http"
	"time"
)

type Endereco struct {
	CEP        string `json:"cep"`
	Logradouro string `json:"logradouro"`
	Bairro     string `json:"bairro"`
	Localidade string `json:"localidade"`
	UF         string `json:"uf"`
	Erro       any    `json:"erro"`
}

func consultarCEP(cep string) (*Endereco, error) {
	cliente := &http.Client{Timeout: 5 * time.Second}
	resp, err := cliente.Get(fmt.Sprintf("https://viacep.com.br/ws/%s/json/", cep))
	if err != nil {
		return nil, err
	}
	defer resp.Body.Close()
	if resp.StatusCode != http.StatusOK {
		return nil, fmt.Errorf("viacep: status %d", resp.StatusCode)
	}
	var e Endereco
	if err := json.NewDecoder(resp.Body).Decode(&e); err != nil {
		return nil, err
	}
	if e.Erro != nil {
		return nil, nil
	}
	return &e, nil
}
'''
powershell = '''
function Get-Cep {
    param([Parameter(Mandatory)][ValidatePattern('^\d{5}-?\d{3}$')][string]$Cep)
    $digitos = $Cep -replace '\D', ''
    $r = Invoke-RestMethod -Uri "https://viacep.com.br/ws/$digitos/json/" -TimeoutSec 5
    if ($r.erro) { return $null }
    $r
}
'''

[[pattern]]
id = "br.currency"
title = "Formatar moeda em reais (R$)"
keywords = "formatar moeda reais real brl dinheiro valor monetario r$ preco"
require = ["moeda", "reais", "currency", "brl", "dinheiro", "monetario"]
tags = ["brasil", "format"]

[pattern.code]
python = '''
from decimal import ROUND_HALF_UP, Decimal


def formatar_brl(valor) -> str:
    """Sem depender do locale do SO. Use Decimal para dinheiro (float acumula erro)."""
    v = Decimal(str(valor)).quantize(Decimal("0.01"), rounding=ROUND_HALF_UP)
    texto = f"{abs(v):,.2f}".replace(",", "X").replace(".", ",").replace("X", ".")
    return f"-R$ {texto}" if v < 0 else f"R$ {texto}"
'''
javascript = '''
const formatarBrl = (valor) =>
  new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" }).format(valor);
'''
typescript = '''
export const formatarBrl = (valor: number): string =>
  new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" }).format(valor);
'''
java = '''
static String formatarBrl(java.math.BigDecimal valor) {
    return java.text.NumberFormat.getCurrencyInstance(java.util.Locale.of("pt", "BR")).format(valor);
}
'''
csharp = '''
static string FormatarBrl(decimal valor) => valor.ToString("C", new System.Globalization.CultureInfo("pt-BR"));
'''
powershell = '''
function Format-Brl([decimal]$Valor) { $Valor.ToString('C', [cultureinfo]'pt-BR') }
'''
go = '''
import (
	"fmt"
	"strings"
)

// formatarBRL recebe centavos (inteiro) para evitar erros de ponto flutuante.
func formatarBRL(centavos int64) string {
	sinal := ""
	if centavos < 0 {
		sinal, centavos = "-", -centavos
	}
	inteiro := fmt.Sprint(centavos / 100)
	var b strings.Builder
	for i, r := range inteiro {
		if i > 0 && (len(inteiro)-i)%3 == 0 {
			b.WriteByte('.')
		}
		b.WriteRune(r)
	}
	return fmt.Sprintf("%sR$ %s,%02d", sinal, b.String(), centavos%100)
}
'''

[pattern.test]
python = '''
assert formatar_brl(1234.5) == "R$ 1.234,50" and formatar_brl(-0.005) == "-R$ 0,01" and formatar_brl(1000000) == "R$ 1.000.000,00"
'''
javascript = '''
if (formatarBrl(1234.5).replace(/\s/g, " ") !== "R$ 1.234,50") throw new Error("falhou: " + formatarBrl(1234.5));
'''
powershell = '''
if ((Format-Brl 1234.5) -notmatch '^R\$\s?1\.234,50$') { throw "falhou: $(Format-Brl 1234.5)" }
'''

[[pattern]]
id = "br.business_days"
title = "Dias úteis com feriados nacionais (Páscoa calculada)"
keywords = "dias uteis feriados nacionais brasil pascoa carnaval corpus christi prazo calcular data util"
require = ["uteis", "feriados", "feriado", "pascoa"]
tags = ["brasil", "datetime"]

[pattern.code]
python = '''
from datetime import date, timedelta


def pascoa(ano: int) -> date:
    """Algoritmo de Meeus/Jones/Butcher (calendário gregoriano)."""
    a, b, c = ano % 19, ano // 100, ano % 100
    d, e = b // 4, b % 4
    f = (b + 8) // 25
    g = (b - f + 1) // 3
    h = (19 * a + b - d - g + 15) % 30
    i, k = c // 4, c % 4
    l_ = (32 + 2 * e + 2 * i - h - k) % 7
    m = (a + 11 * h + 22 * l_) // 451
    mes = (h + l_ - 7 * m + 114) // 31
    dia = (h + l_ - 7 * m + 114) % 31 + 1
    return date(ano, mes, dia)


def feriados(ano: int, facultativos: bool = True) -> set[date]:
    fixos = {(1, 1), (4, 21), (5, 1), (9, 7), (10, 12), (11, 2), (11, 15), (11, 20), (12, 25)}
    p = pascoa(ano)
    dias = {date(ano, m, d) for m, d in fixos} | {p - timedelta(days=2)}  # Sexta-feira Santa
    if facultativos:  # Carnaval (segunda e terça) e Corpus Christi: pontos facultativos nacionais
        dias |= {p - timedelta(days=48), p - timedelta(days=47), p + timedelta(days=60)}
    return dias


def eh_dia_util(d: date, facultativos: bool = True) -> bool:
    return d.weekday() < 5 and d not in feriados(d.year, facultativos)


def somar_dias_uteis(inicio: date, n: int) -> date:
    d = inicio
    while n > 0:
        d += timedelta(days=1)
        if eh_dia_util(d):
            n -= 1
    return d
'''
javascript = '''
function pascoa(ano) {
  const a = ano % 19, b = Math.floor(ano / 100), c = ano % 100;
  const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const mes = Math.floor((h + l - 7 * m + 114) / 31);
  const dia = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(Date.UTC(ano, mes - 1, dia));
}

function feriados(ano, facultativos = true) {
  const dia = (m, d) => Date.UTC(ano, m - 1, d);
  const p = pascoa(ano).getTime();
  const D = 86_400_000;
  const s = new Set([dia(1, 1), dia(4, 21), dia(5, 1), dia(9, 7), dia(10, 12), dia(11, 2), dia(11, 15), dia(11, 20), dia(12, 25), p - 2 * D]);
  if (facultativos) [p - 48 * D, p - 47 * D, p + 60 * D].forEach((x) => s.add(x));
  return s;
}

function ehDiaUtil(dataUtc, facultativos = true) {
  const dow = dataUtc.getUTCDay();
  return dow !== 0 && dow !== 6 && !feriados(dataUtc.getUTCFullYear(), facultativos).has(dataUtc.getTime());
}
'''

[pattern.test]
python = '''
from datetime import date
assert pascoa(2026) == date(2026, 4, 5) and pascoa(2025) == date(2025, 4, 20)
assert date(2026, 4, 3) in feriados(2026) and date(2026, 2, 17) in feriados(2026) and date(2026, 6, 4) in feriados(2026)
assert not eh_dia_util(date(2026, 11, 20)) and eh_dia_util(date(2026, 10, 2))
assert somar_dias_uteis(date(2026, 4, 2), 1) == date(2026, 4, 6)
'''
javascript = '''
if (pascoa(2026).toISOString().slice(0, 10) !== "2026-04-05") throw new Error("páscoa");
if (ehDiaUtil(new Date(Date.UTC(2026, 10, 20))) || !ehDiaUtil(new Date(Date.UTC(2026, 9, 2)))) throw new Error("falhou");
'''

[[pattern]]
id = "br.pix_copia_cola"
title = "Gerar Pix copia e cola (BR Code estático)"
keywords = "pix copia e cola qrcode br code brcode emv chave pix pagamento estatico crc16"
require = ["pix", "brcode"]
tags = ["brasil", "payments"]

[pattern.code]
python = '''
def _campo(id_: str, valor: str) -> str:
    return f"{id_}{len(valor):02d}{valor}"


def crc16_ccitt(dados: str) -> str:
    """CRC-16/CCITT-FALSE (polinômio 0x1021, valor inicial 0xFFFF), como exige o padrão EMV do Pix."""
    crc = 0xFFFF
    for byte in dados.encode("utf-8"):
        crc ^= byte << 8
        for _ in range(8):
            crc = ((crc << 1) ^ 0x1021) if crc & 0x8000 else crc << 1
            crc &= 0xFFFF
    return f"{crc:04X}"


def pix_copia_e_cola(chave: str, nome: str, cidade: str, valor: float | None = None, txid: str = "***") -> str:
    """Payload estático do Pix (Manual do BR Code, Banco Central). Nome até 25 e cidade até 15 caracteres, sem acentos."""
    conta = _campo("00", "br.gov.bcb.pix") + _campo("01", chave)
    payload = (_campo("00", "01") + _campo("26", conta) + _campo("52", "0000") + _campo("53", "986")
               + (_campo("54", f"{valor:.2f}") if valor else "") + _campo("58", "BR")
               + _campo("59", nome[:25]) + _campo("60", cidade[:15]) + _campo("62", _campo("05", txid)) + "6304")
    return payload + crc16_ccitt(payload)
'''
