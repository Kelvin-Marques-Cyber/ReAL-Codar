[[pattern]]
id = "br.cnpj"
title = "Validar CNPJ (numérico e alfanumérico)"
keywords = "cnpj validar validacao digito verificador empresa alfanumerico formatar"
require = ["cnpj"]
tags = ["brasil", "validation"]

[pattern.code]
python = '''
import re

_PESOS1 = [5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2]
_PESOS2 = [6] + _PESOS1


def _dv(base: str, pesos: list[int]) -> str:
    # CNPJ alfanumérico (Receita Federal, a partir de 07/2026): valor = código ASCII - 48.
    soma = sum((ord(c) - 48) * p for c, p in zip(base, pesos))
    resto = soma % 11
    return "0" if resto < 2 else str(11 - resto)


def validar_cnpj(cnpj: str) -> bool:
    """Aceita o formato numérico e o novo alfanumérico (12 caracteres [0-9A-Z] + 2 dígitos)."""
    c = re.sub(r"[./\-\s]", "", cnpj).upper()
    if not re.fullmatch(r"[0-9A-Z]{12}\d{2}", c) or c == c[0] * 14:
        return False
    return c[12] == _dv(c[:12], _PESOS1) and c[13] == _dv(c[:13], _PESOS2)


def formatar_cnpj(cnpj: str) -> str:
    c = re.sub(r"[./\-\s]", "", cnpj).upper()
    return f"{c[:2]}.{c[2:5]}.{c[5:8]}/{c[8:12]}-{c[12:]}"
'''
javascript = '''
function validarCnpj(cnpj) {
  const c = String(cnpj).replace(/[./\-\s]/g, "").toUpperCase();
  if (!/^[0-9A-Z]{12}\d{2}$/.test(c) || /^(.)\1{13}$/.test(c)) return false;
  // CNPJ alfanumérico (a partir de 07/2026): valor de cada caractere = código ASCII - 48.
  const dv = (base, pesos) => {
    const soma = [...base].reduce((s, ch, i) => s + (ch.charCodeAt(0) - 48) * pesos[i], 0);
    const resto = soma % 11;
    return resto < 2 ? 0 : 11 - resto;
  };
  const p1 = [5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2];
  return dv(c.slice(0, 12), p1) === Number(c[12]) && dv(c.slice(0, 13), [6, ...p1]) === Number(c[13]);
}
'''
typescript = '''
export function validarCnpj(cnpj: string): boolean {
  const c = cnpj.replace(/[./\-\s]/g, "").toUpperCase();
  if (!/^[0-9A-Z]{12}\d{2}$/.test(c) || /^(.)\1{13}$/.test(c)) return false;
  const dv = (base: string, pesos: number[]): number => {
    const soma = [...base].reduce((s, ch, i) => s + (ch.charCodeAt(0) - 48) * pesos[i], 0);
    const resto = soma % 11;
    return resto < 2 ? 0 : 11 - resto;
  };
  const p1 = [5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2];
  return dv(c.slice(0, 12), p1) === Number(c[12]) && dv(c.slice(0, 13), [6, ...p1]) === Number(c[13]);
}
'''
go = '''
import (
	"regexp"
	"strings"
)

var reCNPJ = regexp.MustCompile(`^[0-9A-Z]{12}[0-9]{2}$`)

func validarCNPJ(cnpj string) bool {
	c := strings.ToUpper(strings.NewReplacer(".", "", "/", "", "-", "", " ", "").Replace(cnpj))
	if !reCNPJ.MatchString(c) || strings.Count(c, c[:1]) == len(c) {
		return false
	}
	pesos := []int{6, 5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2}
	dv := func(n int) byte {
		soma := 0
		for i := 0; i < n; i++ {
			soma += int(c[i]-48) * pesos[13-n+i]
		}
		if r := soma % 11; r >= 2 {
			return byte('0' + 11 - r)
		}
		return '0'
	}
	return dv(12) == c[12] && dv(13) == c[13]
}
'''
csharp = '''
static bool ValidarCnpj(string cnpj)
{
    var c = new string(cnpj.Where(char.IsAsciiLetterOrDigit).ToArray()).ToUpperInvariant();
    if (!System.Text.RegularExpressions.Regex.IsMatch(c, "^[0-9A-Z]{12}[0-9]{2}$") || c.Distinct().Count() == 1) return false;
    int[] pesos = [6, 5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2];
    char Dv(int n)
    {
        int soma = 0;
        for (int i = 0; i < n; i++) soma += (c[i] - 48) * pesos[13 - n + i];
        int resto = soma % 11;
        return resto < 2 ? '0' : (char)('0' + 11 - resto);
    }
    return Dv(12) == c[12] && Dv(13) == c[13];
}
'''
php = '''
<?php
function validarCnpj(string $cnpj): bool
{
    $c = strtoupper(preg_replace('/[.\/\-\s]/', '', $cnpj));
    if (!preg_match('/^[0-9A-Z]{12}\d{2}$/', $c) || preg_match('/^(.)\1{13}$/', $c)) {
        return false;
    }
    $pesos = [6, 5, 4, 3, 2, 9, 8, 7, 6, 5, 4, 3, 2];
    foreach ([12, 13] as $n) {
        $soma = 0;
        for ($i = 0; $i < $n; $i++) {
            $soma += (ord($c[$i]) - 48) * $pesos[13 - $n + $i];
        }
        $resto = $soma % 11;
        if (($resto < 2 ? 0 : 11 - $resto) !== (int) $c[$n]) {
            return false;
        }
    }
    return true;
}
'''

[pattern.test]
python = '''
