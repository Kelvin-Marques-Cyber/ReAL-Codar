[[pattern]]
id = "cli.confirm"
title = "Pedir confirmação sim/não no terminal"
keywords = "confirmar confirmacao pedir perguntar usuario sim nao yes no prompt terminal tem certeza continuar antes apagar excluir remover"
require = ["confirmar", "confirmacao", "confirm", "confirmation"]
tags = ["cli", "best-practice"]

[pattern.code]
python = '''
from collections.abc import Callable


def confirmar(pergunta: str, padrao: bool = False, ler: Callable[[str], str] = input) -> bool:
    """Pergunta sim/não. Enter vazio usa o padrão; sem terminal (pipe, Ctrl+D) também. Aceita s/sim/y/yes e
    n/não/nao/no, em qualquer caixa; outra resposta pergunta de novo."""
    opcoes = "[S/n]" if padrao else "[s/N]"
    while True:
        try:
            resposta = ler(f"{pergunta} {opcoes} ").strip().lower()
        except EOFError:
            return padrao
        if not resposta:
            return padrao
        if resposta in ("s", "sim", "y", "yes"):
            return True
        if resposta in ("n", "não", "nao", "no"):
            return False
        print("responda s ou n")
'''
javascript = '''
import * as readline from "node:readline/promises";

// Lê uma linha do terminal; devolve null se a entrada acabar (pipe, Ctrl+D) em vez de travar.
async function perguntarNoTerminal(texto) {
  const rl = readline.createInterface({ input: process.stdin, output: process.stdout });
  const fechou = new Promise((resolve) => rl.once("close", () => resolve(null)));
  try {
    return await Promise.race([rl.question(texto), fechou]);
  } finally {
    rl.close();
  }
}

/** Pergunta sim/não. Enter vazio ou entrada fechada usam o padrão. */
export async function confirmar(pergunta, padrao = false, ler = perguntarNoTerminal) {
  for (;;) {
    const resposta = await ler(`${pergunta} ${padrao ? "[S/n]" : "[s/N]"} `);
    if (resposta === null) return padrao;
    const r = resposta.trim().toLowerCase();
    if (!r) return padrao;
    if (["s", "sim", "y", "yes"].includes(r)) return true;
    if (["n", "não", "nao", "no"].includes(r)) return false;
    console.log("responda s ou n");
  }
}
'''
bash = '''
# confirmar "Pergunta?" [s|n]: status 0 para sim, 1 para não. Enter vazio ou entrada fechada usam o padrão.
confirmar() {
  local pergunta="$1" padrao="${2:-n}" resposta opcoes="[s/N]"
  [[ "$padrao" == s ]] && opcoes="[S/n]"
  while true; do
    if ! read -r -p "$pergunta $opcoes " resposta; then
      [[ "$padrao" == s ]]
      return
    fi
    case "${resposta,,}" in
      "") [[ "$padrao" == s ]]; return ;;
      s | sim | y | yes) return 0 ;;
      n | não | nao | no) return 1 ;;
      *) echo "responda s ou n" >&2 ;;
    esac
  done
}
'''
powershell = '''
function Confirm-Acao {
    <#
    .SYNOPSIS
    Pergunta sim/não. Enter vazio usa o padrão. Para confirmar ações destrutivas em cmdlets, prefira
    [CmdletBinding(SupportsShouldProcess)] e $PSCmdlet.ShouldProcess, que dão -WhatIf e -Confirm de graça.
    #>
    [CmdletBinding()]
    param(
        [Parameter(Mandatory)][string]$Pergunta,
        [switch]$PadraoSim,
        [scriptblock]$Ler = { param($texto) Read-Host -Prompt $texto }
    )
    $opcoes = if ($PadraoSim) { '[S/n]' } else { '[s/N]' }
    while ($true) {
        $resposta = & $Ler "$Pergunta $opcoes"
        if ($null -eq $resposta) { return [bool]$PadraoSim }
        switch -Regex ($resposta.Trim().ToLowerInvariant()) {
            '^$' { return [bool]$PadraoSim }
            '^(s|sim|y|yes)$' { return $true }
            '^(n|não|nao|no)$' { return $false }
            default { Write-Host 'responda s ou n' }
        }
    }
}
'''

