# Programas de linha de comando: erros de uso saem com código 2 e mensagem que diz o que digitar, prompts não travam
# quando a entrada acaba (pipe, Ctrl+D) e a configuração mostra todos os problemas de uma vez.

[[pattern]]
id = "cli.subcommands"
title = "Programa de linha de comando com subcomandos"
keywords = "cli linha de comando subcomandos subcomando argumentos opcoes flags argparse parametros terminal programa"
require = ["subcomando", "subcomandos", "subcommand", "subcommands", "argparse", "argumentos", "arguments"]
tags = ["cli", "best-practice"]

[pattern.code]
python = '''
import argparse
import sys


def construir_parser() -> argparse.ArgumentParser:
    parser = argparse.ArgumentParser(prog="tarefas", description="Gerencia uma lista de tarefas.")
    sub = parser.add_subparsers(dest="comando", required=True, metavar="{adicionar,listar}")
    adicionar = sub.add_parser("adicionar", help="adiciona uma tarefa")
    adicionar.add_argument("titulo", help="o que precisa ser feito")
    adicionar.add_argument("--prioridade", type=int, choices=range(1, 6), default=3, metavar="1-5")
    listar = sub.add_parser("listar", help="lista as tarefas")
    listar.add_argument("--todas", action="store_true", help="inclui as concluídas")
    return parser


def main(argv: list[str] | None = None) -> int:
    """Erros de uso saem com código 2 (o argparse já faz isso) e a mensagem mostra o uso correto."""
    args = construir_parser().parse_args(argv)
    if args.comando == "adicionar":
        print(f"adicionada: {args.titulo} (prioridade {args.prioridade})")
    else:
        print("listando todas" if args.todas else "listando pendentes")
    return 0


if __name__ == "__main__":
    sys.exit(main())
'''
javascript = '''
import { parseArgs } from "node:util";

const COMANDOS = {
  adicionar: {
    uso: "adicionar <titulo> [--prioridade 1-5]",
    opcoes: { prioridade: { type: "string", default: "3" } },
    executar({ values, positionals }) {
      const prioridade = Number(values.prioridade);
      if (positionals.length !== 1 || !Number.isInteger(prioridade) || prioridade < 1 || prioridade > 5) {
        throw new Error(`uso: tarefas ${this.uso}`);
      }
      console.log(`adicionada: ${positionals[0]} (prioridade ${prioridade})`);
    },
  },
  listar: {
    uso: "listar [--todas]",
    opcoes: { todas: { type: "boolean", default: false } },
    executar({ values }) {
      console.log(values.todas ? "listando todas" : "listando pendentes");
    },
  },
};

export function main(argv) {
  const [nome, ...resto] = argv;
  const comando = Object.hasOwn(COMANDOS, nome ?? "") ? COMANDOS[nome] : null;
  if (!comando) {
    console.error(`comando inválido: ${nome ?? "(nenhum)"}\nuso: tarefas {${Object.keys(COMANDOS).join(",")}} ...`);
    return 2;
  }
  try {
    comando.executar(parseArgs({ args: resto, options: comando.opcoes, allowPositionals: true }));
    return 0;
  } catch (err) {
    console.error(err.message); // opção desconhecida ou uso errado: código 2, como nos programas Unix
    return 2;
  }
}

process.exitCode = main(process.argv.slice(2));
'''
go = '''
package main

import (
	"flag"
	"fmt"
	"io"
	"os"
)

func uso(stderr io.Writer) int {
	fmt.Fprintln(stderr, "uso: tarefas {adicionar,listar} ...")
	return 2
}

// parse aceita opções antes e depois dos argumentos ("adicionar pão --prioridade 5"), o que o flag sozinho não faz.
func parse(fs *flag.FlagSet, args []string) ([]string, error) {
	var posicionais []string
	for {
		if err := fs.Parse(args); err != nil {
			return nil, err
		}
		args = fs.Args()
		if len(args) == 0 {
			return posicionais, nil
		}
		posicionais = append(posicionais, args[0])
		args = args[1:]
	}
}

func run(args []string, stdout, stderr io.Writer) int {
	if len(args) == 0 {
		return uso(stderr)
	}
	switch args[0] {
	case "adicionar":
		fs := flag.NewFlagSet("adicionar", flag.ContinueOnError)
		fs.SetOutput(stderr)
		prioridade := fs.Int("prioridade", 3, "prioridade de 1 a 5")
		posicionais, err := parse(fs, args[1:])
		if err != nil || len(posicionais) != 1 || *prioridade < 1 || *prioridade > 5 {
			fmt.Fprintln(stderr, "uso: tarefas adicionar <titulo> [--prioridade 1-5]")
			return 2
		}
		fmt.Fprintf(stdout, "adicionada: %s (prioridade %d)\n", posicionais[0], *prioridade)
	case "listar":
		fs := flag.NewFlagSet("listar", flag.ContinueOnError)
		fs.SetOutput(stderr)
		todas := fs.Bool("todas", false, "inclui as concluídas")
		if _, err := parse(fs, args[1:]); err != nil {
			return 2
		}
		if *todas {
			fmt.Fprintln(stdout, "listando todas")
		} else {
			fmt.Fprintln(stdout, "listando pendentes")
		}
	default:
		fmt.Fprintf(stderr, "comando inválido: %s\n", args[0])
		return uso(stderr)
	}
	return 0
}

func main() {
	os.Exit(run(os.Args[1:], os.Stdout, os.Stderr))
}
'''
bash = '''
#!/usr/bin/env bash
set -euo pipefail

uso() {
  echo "uso: tarefas {adicionar,listar} ..." >&2
  exit 2
}

cmd_adicionar() {
  local prioridade=3 titulo=""
  while (($#)); do
    case "$1" in
      --prioridade) prioridade="${2:-}"; shift 2 || uso ;;
      --prioridade=*) prioridade="${1#*=}"; shift ;;
      -*) echo "opção desconhecida: $1" >&2; exit 2 ;;
      *) [[ -z "$titulo" ]] || uso; titulo="$1"; shift ;;
    esac
  done
  [[ -n "$titulo" && "$prioridade" =~ ^[1-5]$ ]] || uso
  echo "adicionada: $titulo (prioridade $prioridade)"
}

cmd_listar() {
  local todas=0
  while (($#)); do
    case "$1" in
      --todas) todas=1; shift ;;
      *) echo "opção desconhecida: $1" >&2; exit 2 ;;
    esac
  done
  if ((todas)); then echo "listando todas"; else echo "listando pendentes"; fi
}

main() {
  (($#)) || uso
  local comando="$1"
  shift
  case "$comando" in
    adicionar) cmd_adicionar "$@" ;;
    listar) cmd_listar "$@" ;;
    *) echo "comando inválido: $comando" >&2; uso ;;
  esac
}

main "$@"
'''
powershell = '''
# No PowerShell, as opções seguem a convenção da linguagem: -Prioridade 5, -Todas.
[CmdletBinding()]
param(
    [Parameter(Position = 0)][string]$Comando,
    [Parameter(Position = 1)][string]$Titulo,
    [int]$Prioridade = 3,
    [switch]$Todas
)

function Write-Uso {
    [Console]::Error.WriteLine('uso: tarefas.ps1 {adicionar,listar} [<titulo>] [-Prioridade 1-5] [-Todas]')
    exit 2
}

switch ($Comando) {
    'adicionar' {
        if (-not $Titulo -or $Prioridade -lt 1 -or $Prioridade -gt 5) { Write-Uso }
        Write-Output "adicionada: $Titulo (prioridade $Prioridade)"
    }
    'listar' {
        if ($Todas) { Write-Output 'listando todas' } else { Write-Output 'listando pendentes' }
    }
    default {
        [Console]::Error.WriteLine("comando inválido: $Comando")
        Write-Uso
    }
}
'''

