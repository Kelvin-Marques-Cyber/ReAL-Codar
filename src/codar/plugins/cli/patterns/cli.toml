[[pattern]]
id = "cli.env_config"
title = "Configuração por variáveis de ambiente com validação"
keywords = "configuracao config variaveis de ambiente env environment ler carregar validar porta debug 12 factor settings"
require = ["ambiente", "environment", "env", "dotenv"]
tags = ["cli", "config", "best-practice"]

[pattern.code]
python = '''
import os
from collections.abc import Mapping
from dataclasses import dataclass


@dataclass(frozen=True)
class Config:
    porta: int
    debug: bool
    url_banco: str


def _booleano(valor: str) -> bool:
    v = valor.strip().lower()
    if v in ("1", "true", "sim", "yes", "on"):
        return True
    if v in ("", "0", "false", "nao", "não", "no", "off"):
        return False
    raise ValueError(f"esperava sim/não, veio {valor!r}")


def carregar_config(env: Mapping[str, str] = os.environ) -> Config:
    """Lê a configuração do ambiente (12-factor). Junta todos os erros numa mensagem só: quem configura corrige
    tudo de uma vez, em vez de descobrir um problema por execução."""
    erros = []
    porta = 0
    try:
        porta = int(env.get("PORTA", "8080"))
        if not 1 <= porta <= 65535:
            raise ValueError
    except ValueError:
        erros.append(f"PORTA deve ser um número de 1 a 65535 (veio {env.get('PORTA')!r})")
    debug = False
    try:
        debug = _booleano(env.get("DEBUG", "0"))
    except ValueError as exc:
        erros.append(f"DEBUG: {exc}")
    url_banco = env.get("URL_BANCO", "")
    if not url_banco:
        erros.append("URL_BANCO é obrigatória")
    if erros:
        raise ValueError("configuração inválida:\n  " + "\n  ".join(erros))
    return Config(porta, debug, url_banco)
'''
javascript = '''
const VERDADEIRO = ["1", "true", "sim", "yes", "on"];
const FALSO = ["", "0", "false", "nao", "não", "no", "off"];

/**
 * Lê a configuração do ambiente (12-factor) e junta todos os erros numa mensagem só.
 * @returns {{porta: number, debug: boolean, urlBanco: string}}
 */
export function carregarConfig(env = process.env) {
  const erros = [];
  const porta = Number(env.PORTA ?? "8080");
  if (!Number.isInteger(porta) || porta < 1 || porta > 65535) {
    erros.push(`PORTA deve ser um número de 1 a 65535 (veio ${JSON.stringify(env.PORTA)})`);
  }
  const debugTexto = String(env.DEBUG ?? "0").trim().toLowerCase();
  if (!VERDADEIRO.includes(debugTexto) && !FALSO.includes(debugTexto)) {
    erros.push(`DEBUG: esperava sim/não, veio ${JSON.stringify(env.DEBUG)}`);
  }
  const urlBanco = env.URL_BANCO ?? "";
  if (!urlBanco) erros.push("URL_BANCO é obrigatória");
  if (erros.length) throw new Error(`configuração inválida:\n  ${erros.join("\n  ")}`);
  return Object.freeze({ porta, debug: VERDADEIRO.includes(debugTexto), urlBanco });
}
'''
bash = '''
# carregar_config: valida PORTA, DEBUG e URL_BANCO do ambiente e mostra todos os erros de uma vez.
carregar_config() {
  local erros=()
  PORTA="${PORTA:-8080}"
  if ! [[ "$PORTA" =~ ^[0-9]+$ ]] || ((PORTA < 1 || PORTA > 65535)); then
    erros+=("PORTA deve ser um número de 1 a 65535 (veio '$PORTA')")
  fi
  local debug="${DEBUG:-0}"
  case "${debug,,}" in
    1 | true | sim | yes | on) DEBUG=1 ;;
    "" | 0 | false | nao | não | no | off) DEBUG=0 ;;
    *) erros+=("DEBUG: esperava sim/não, veio '$debug'") ;;
  esac
  [[ -n "${URL_BANCO:-}" ]] || erros+=("URL_BANCO é obrigatória")
  if ((${#erros[@]})); then
    printf 'configuração inválida:\n' >&2
    printf '  %s\n' "${erros[@]}" >&2
    return 1
  fi
  export PORTA DEBUG URL_BANCO
}
'''
powershell = '''
function Get-Configuracao {
    <#
    .SYNOPSIS
    Lê PORTA, DEBUG e URL_BANCO do ambiente (12-factor) e junta todos os erros numa mensagem só.
    #>
    [CmdletBinding()]
    param([hashtable]$Ambiente)
    $ler = { param($nome, $padrao) if ($Ambiente) { $Ambiente[$nome] } else { [Environment]::GetEnvironmentVariable($nome) } }
    $erros = [System.Collections.Generic.List[string]]::new()
    $textoPorta = & $ler 'PORTA'
    if (-not $textoPorta) { $textoPorta = '8080' }
    $porta = 0
    if (-not [int]::TryParse($textoPorta, [ref]$porta) -or $porta -lt 1 -or $porta -gt 65535) {
        $erros.Add("PORTA deve ser um número de 1 a 65535 (veio '$textoPorta')")
    }
    $textoDebug = [string](& $ler 'DEBUG')
    $debug = $false
    switch -Regex ($textoDebug.Trim().ToLowerInvariant()) {
        '^(1|true|sim|yes|on)$' { $debug = $true }
        '^(|0|false|nao|não|no|off)$' { $debug = $false }
        default { $erros.Add("DEBUG: esperava sim/não, veio '$textoDebug'") }
    }
    $url = & $ler 'URL_BANCO'
    if (-not $url) { $erros.Add('URL_BANCO é obrigatória') }
    if ($erros.Count) { throw "configuração inválida:`n  " + ($erros -join "`n  ") }
    [pscustomobject]@{ Porta = $porta; Debug = $debug; UrlBanco = $url }
}
'''

