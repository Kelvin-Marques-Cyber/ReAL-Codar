[[pattern]]
id = "dados.correlacao"
title = "Correlação entre as colunas numéricas de uma tabela"
keywords = "correlacao correlacoes correlacionadas relacao entre colunas numericas corr pearson matriz tabela dataframe csv pandas"
require = ["correlacao", "correlacoes", "correlacionadas", "correlation", "corr"]
tags = ["dados", "pandas"]
slots = { path = "vendas.csv" }

[pattern.code]
python = '''
import pandas as pd

df = pd.read_csv("{{path}}")
correlacao = df.corr(numeric_only=True)  # de -1 (uma sobe, a outra desce) a 1 (sobem juntas); 0 = sem relação linear
print(correlacao.round(2))
'''
r = '''
df <- read.csv("{{path}}")
numericas <- df[sapply(df, is.numeric)]
print(round(cor(numericas, use = "complete.obs"), 2))  # de -1 a 1; 0 = sem relação linear
'''

