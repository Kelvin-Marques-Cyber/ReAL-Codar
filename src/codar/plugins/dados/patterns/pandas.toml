[[pattern]]
id = "dados.pivot"
title = "Tabela dinâmica (pivot) com totais por linha e coluna"
keywords = "tabela dinamica pivot pivot_table cruzar linhas colunas totais soma por mes categoria pandas csv"
require = ["pivot", "dinamica", "pivotar"]
tags = ["dados", "pandas"]
slots = { path = "vendas.csv", linhas = "categoria", colunas = "mes", field = "preco" }

[pattern.code]
python = '''
import pandas as pd

df = pd.read_csv("{{path}}")
tabela = pd.pivot_table(df, index="{{linhas}}", columns="{{colunas}}", values="{{field}}", aggfunc="sum",
                        fill_value=0, margins=True, margins_name="Total")
print(tabela)
'''

[pattern.test]
modules = ["pandas"]
python_setup = '''
import csv
with open("vendas.csv", "w", newline="", encoding="utf-8") as f:
    csv.writer(f).writerows([["categoria", "mes", "preco"], ["papelaria", "jan", 10], ["papelaria", "fev", 5],
                             ["informatica", "jan", 50]])
'''
python = '''
assert tabela.loc["Total", "Total"] == 65 and tabela.loc["informatica", "fev"] == 0
'''
