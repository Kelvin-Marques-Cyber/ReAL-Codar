# Visão computacional com OpenCV. Use o pacote opencv-python-headless: é o OpenCV sem as janelas (cv2.imshow), mais
# leve e o que funciona em servidores e via SSH. Por isso estes exemplos salvam o resultado em arquivo em vez de
# abrir janelas; no Studio, a imagem salva pode ser vista no celular pelo endereço de rede. O OpenCV usa as cores na
# ordem BGR (azul, verde, vermelho), não RGB. Os exemplos funcionam no OpenCV 4 e no 5.

[[pattern]]
id = "visao.ler_imagem"
title = "Abrir uma imagem com OpenCV e ver tamanho e canais"
keywords = "abrir ler carregar imagem foto figura opencv cv2 imread tamanho largura altura pixels canais"
require = ["imagem", "imagens", "foto", "fotos", "image", "opencv", "cv2"]
tags = ["visao", "opencv"]
slots = { path = "foto.png" }

[pattern.code]
python = '''
import cv2

imagem = cv2.imread("{{path}}")
if imagem is None:  # o OpenCV não dá erro: devolve None quando não consegue abrir
    raise SystemExit("não consegui abrir {{path}}: confira o caminho e o formato")
altura, largura = imagem.shape[:2]
canais = 1 if imagem.ndim == 2 else imagem.shape[2]
print(f"{largura}x{altura} pixels, {canais} canais (ordem BGR)")
'''

[pattern.test]
modules = ["cv2", "numpy"]
python_setup = '''
import cv2, numpy as np
img = np.zeros((120, 200, 3), dtype=np.uint8)
cv2.rectangle(img, (20, 20), (80, 80), (255, 255, 255), -1)
cv2.circle(img, (150, 60), 30, (0, 255, 0), -1)
cv2.imwrite("foto.png", img)
'''
python = '''
assert (largura, altura, canais) == (200, 120, 3)
'''

