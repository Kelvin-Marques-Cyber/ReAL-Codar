# Matemática e strings: versões iterativas (sem estouro de pilha), seguras para Unicode e com entradas validadas.

[[pattern]]
id = "algo.fibonacci"
title = "Fibonacci"
keywords = "fibonacci fib sequencia numero n-esimo termo"
require = ["fibonacci"]
tags = ["algorithm", "math"]

[pattern.code]
python = '''
def fibonacci(n: int) -> int:
    """n-ésimo termo (fibonacci(0) = 0). O(n) tempo, O(1) memória; inteiros Python não estouram."""
    if n < 0:
        raise ValueError("n deve ser >= 0")
    a, b = 0, 1
    for _ in range(n):
        a, b = b, a + b
    return a
'''
javascript = '''
/** n-ésimo termo como BigInt (sem perder precisão acima de 2^53). */
function fibonacci(n) {
  if (!Number.isInteger(n) || n < 0) throw new RangeError("n deve ser inteiro >= 0");
  let a = 0n;
  let b = 1n;
  for (let i = 0; i < n; i++) [a, b] = [b, a + b];
  return a;
}
'''
typescript = '''
export function fibonacci(n: number): bigint {
  if (!Number.isInteger(n) || n < 0) throw new RangeError("n deve ser inteiro >= 0");
  let a = 0n;
  let b = 1n;
  for (let i = 0; i < n; i++) [a, b] = [b, a + b];
  return a;
}
'''
go = '''
import "math/big"

// fibonacci devolve o n-ésimo termo com precisão arbitrária.
func fibonacci(n int) *big.Int {
	a, b := big.NewInt(0), big.NewInt(1)
	for i := 0; i < n; i++ {
		a.Add(a, b)
		a, b = b, a
	}
	return a
}
'''
rust = '''
/// n-ésimo termo; None se estourar u128 (n > 186).
fn fibonacci(n: u32) -> Option<u128> {
    let (mut a, mut b) = (0u128, 1u128);
    for _ in 0..n {
        let prox = a.checked_add(b)?;
        a = b;
        b = prox;
    }
    Some(a)
}
'''
java = '''
/** n-ésimo termo com precisão arbitrária. */
static java.math.BigInteger fibonacci(int n) {
    if (n < 0) {
        throw new IllegalArgumentException("n deve ser >= 0");
    }
    java.math.BigInteger a = java.math.BigInteger.ZERO, b = java.math.BigInteger.ONE;
    for (int i = 0; i < n; i++) {
        java.math.BigInteger prox = a.add(b);
        a = b;
        b = prox;
    }
    return a;
}
'''
csharp = '''
static System.Numerics.BigInteger Fibonacci(int n)
{
    ArgumentOutOfRangeException.ThrowIfNegative(n);
    System.Numerics.BigInteger a = 0, b = 1;
    for (int i = 0; i < n; i++) (a, b) = (b, a + b);
    return a;
}
'''
c = '''
#include <stdint.h>

/* n-ésimo termo; válido até n = 93 (limite de uint64_t). */
uint64_t fibonacci(unsigned n) {
    uint64_t a = 0, b = 1;
    for (unsigned i = 0; i < n; i++) {
        uint64_t prox = a + b;
        a = b;
        b = prox;
    }
    return a;
}
'''
powershell = '''
function Get-Fibonacci {
    [CmdletBinding()]
    param([Parameter(Mandatory)][ValidateRange(0, 100000)][int]$N)
    $a = [bigint]0
    $b = [bigint]1
    for ($i = 0; $i -lt $N; $i++) {
        $a, $b = $b, ($a + $b)
    }
    $a
}
'''
bash = '''
fibonacci() {
  local n="$1" a=0 b=1 i prox
  for (( i = 0; i < n; i++ )); do
    prox=$(( a + b ))
    a=$b
    b=$prox
  done
  echo "$a"  # aritmética de 64 bits: válido até n = 92
}
'''
lua = '''
local function fibonacci(n)
  local a, b = 0, 1
  for _ = 1, n do
    a, b = b, a + b
  end
  return a
end
'''

[pattern.test]
powershell = '''
if ((Get-Fibonacci -N 90) -ne [bigint]::Parse('2880067194370816120')) { throw 'falhou' }
'''
python = '''
assert [fibonacci(i) for i in range(8)] == [0, 1, 1, 2, 3, 5, 8, 13] and fibonacci(90) == 2880067194370816120
'''
javascript = '''
if (fibonacci(90) !== 2880067194370816120n || fibonacci(7) !== 13n) throw new Error("falhou");
'''

[[pattern]]
id = "algo.factorial"
title = "Fatorial"
keywords = "fatorial factorial n! produto"
require = ["fatorial", "factorial"]
tags = ["algorithm", "math"]

[pattern.code]
python = '''
import math


def fatorial(n: int) -> int:
    """n! (math.factorial é implementado em C e aceita inteiros grandes)."""
    if n < 0:
        raise ValueError("n deve ser >= 0")
    return math.factorial(n)
'''
javascript = '''
function fatorial(n) {
  if (!Number.isInteger(n) || n < 0) throw new RangeError("n deve ser inteiro >= 0");
  let r = 1n;
  for (let i = 2n; i <= BigInt(n); i++) r *= i;
  return r;
}
'''
go = '''
import "math/big"

func fatorial(n int64) *big.Int {
	return new(big.Int).MulRange(1, n)
}
'''
rust = '''
fn fatorial(n: u32) -> Option<u128> {
    (1..=n as u128).try_fold(1u128, |acc, x| acc.checked_mul(x))
}
'''
powershell = '''
function Get-Fatorial {
    param([Parameter(Mandatory)][ValidateRange(0, 10000)][int]$N)
    $r = [bigint]1
    for ($i = 2; $i -le $N; $i++) { $r *= $i }
    $r
}
'''

[pattern.test]
powershell = '''
if ((Get-Fatorial 20) -ne [bigint]::Parse('2432902008176640000')) { throw 'falhou' }
'''
python = '''
assert fatorial(0) == 1 and fatorial(5) == 120 and fatorial(20) == 2432902008176640000
'''
javascript = '''
if (fatorial(5) !== 120n || fatorial(0) !== 1n) throw new Error("falhou");
'''

[[pattern]]
id = "algo.is_prime"
title = "Verificar número primo"
keywords = "primo primos prime primalidade verificar numero divisores"
require = ["primo", "prime", "primalidade"]
tags = ["algorithm", "math"]

[pattern.code]
python = '''
def eh_primo(n: int) -> bool:
    """Divisão por tentativa com 6k ± 1. O(√n)."""
    if n < 2:
        return False
    if n < 4:
        return True
    if n % 2 == 0 or n % 3 == 0:
        return False
    i = 5
    while i * i <= n:
        if n % i == 0 or n % (i + 2) == 0:
            return False
        i += 6
    return True
'''
