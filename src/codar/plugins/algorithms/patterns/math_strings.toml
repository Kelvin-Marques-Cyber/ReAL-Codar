'''

[[pattern]]
id = "algo.two_sum"
title = "Two sum (par que soma o alvo)"
keywords = "two sum par numeros somam alvo target indices hash mapa complemento"
require = ["two", "pair", "target"]
tags = ["algorithm", "hash"]

[pattern.code]
python = '''
def dois_que_somam(nums: list[int], alvo: int) -> tuple[int, int] | None:
    """Índices (i, j) com nums[i] + nums[j] == alvo em O(n), via dicionário de complementos."""
    vistos: dict[int, int] = {}
    for j, x in enumerate(nums):
        if alvo - x in vistos:
            return vistos[alvo - x], j
        vistos[x] = j
    return None
'''
javascript = '''
function doisQueSomam(nums, alvo) {
  const vistos = new Map();
  for (let j = 0; j < nums.length; j++) {
    const i = vistos.get(alvo - nums[j]);
    if (i !== undefined) return [i, j];
    vistos.set(nums[j], j);
  }
  return null;
}
'''
go = '''
func doisQueSomam(nums []int, alvo int) (int, int, bool) {
	vistos := make(map[int]int, len(nums))
	for j, x := range nums {
		if i, ok := vistos[alvo-x]; ok {
			return i, j, true
		}
		vistos[x] = j
	}
	return 0, 0, false
}
'''
java = '''
static int[] doisQueSomam(int[] nums, int alvo) {
    var vistos = new java.util.HashMap<Integer, Integer>();
    for (int j = 0; j < nums.length; j++) {
        Integer i = vistos.get(alvo - nums[j]);
        if (i != null) {
            return new int[] {i, j};
        }
        vistos.put(nums[j], j);
    }
    return null;
}
'''

[pattern.test]
python = '''
assert dois_que_somam([2, 7, 11, 15], 9) == (0, 1) and dois_que_somam([1, 2], 7) is None
'''
javascript = '''
if (doisQueSomam([2, 7, 11, 15], 9).join() !== "0,1") throw new Error("falhou");
'''

[[pattern]]
id = "algo.sliding_window"
title = "Janela deslizante (soma máxima de k elementos e maior substring sem repetição)"
keywords = "janela deslizante sliding window soma k consecutivos substring sem repeticao caracteres"
require = ["janela", "window", "deslizante", "sliding"]
tags = ["algorithm"]

[pattern.code]
python = '''
def maior_soma_k(nums: list[int], k: int) -> int:
    if not 0 < k <= len(nums):
        raise ValueError("k inválido")
    soma = melhor = sum(nums[:k])
    for i in range(k, len(nums)):
        soma += nums[i] - nums[i - k]
        melhor = max(melhor, soma)
    return melhor


def maior_substring_sem_repeticao(s: str) -> str:
    ultimo, ini, melhor = {}, 0, (0, 0)
    for i, ch in enumerate(s):
        if ultimo.get(ch, -1) >= ini:
            ini = ultimo[ch] + 1
        ultimo[ch] = i
        if i + 1 - ini > melhor[1] - melhor[0]:
            melhor = (ini, i + 1)
    return s[melhor[0]:melhor[1]]
'''
javascript = '''
function maiorSomaK(nums, k) {
  let soma = nums.slice(0, k).reduce((a, b) => a + b, 0);
  let melhor = soma;
  for (let i = k; i < nums.length; i++) {
    soma += nums[i] - nums[i - k];
    melhor = Math.max(melhor, soma);
  }
  return melhor;
}
'''

[pattern.test]
python = '''
assert maior_soma_k([1, 4, 2, 10, 2, 3, 1, 0, 20], 4) == 24 and maior_substring_sem_repeticao("abcabcbb") == "abc"
'''
javascript = '''
if (maiorSomaK([1, 4, 2, 10, 2, 3, 1, 0, 20], 4) !== 24) throw new Error("falhou");
'''

[[pattern]]
id = "algo.word_frequency"
title = "Frequência de palavras"
keywords = "frequencia palavras contar ocorrencias texto mais comuns word count"
require = ["frequencia", "frequency", "ocorrencias"]
tags = ["algorithm", "text"]
slots = { path = "arquivo.txt" }

[pattern.code]
python = '''
import re
from collections import Counter


def frequencia_palavras(texto: str, top: int | None = None) -> list[tuple[str, int]]:
    palavras = re.findall(r"\w+", texto.lower())
    return Counter(palavras).most_common(top)
'''
javascript = '''
function frequenciaPalavras(texto, top = Infinity) {
  const contagem = new Map();
  for (const p of texto.toLowerCase().match(/[\p{L}\p{N}_]+/gu) ?? []) {
    contagem.set(p, (contagem.get(p) ?? 0) + 1);
  }
  return [...contagem].sort((a, b) => b[1] - a[1]).slice(0, top);
}
'''
go = '''
import (
	"sort"
	"strings"
	"unicode"
)

func frequenciaPalavras(texto string) []struct {
	Palavra string
	Qtd     int
} {
	contagem := map[string]int{}
	for _, p := range strings.FieldsFunc(strings.ToLower(texto), func(r rune) bool {
		return !unicode.IsLetter(r) && !unicode.IsDigit(r)
	}) {
		contagem[p]++
	}
	out := make([]struct {
		Palavra string
		Qtd     int
	}, 0, len(contagem))
	for p, q := range contagem {
		out = append(out, struct {
			Palavra string
			Qtd     int
		}{p, q})
	}
	sort.Slice(out, func(i, j int) bool { return out[i].Qtd > out[j].Qtd })
	return out
}
'''
