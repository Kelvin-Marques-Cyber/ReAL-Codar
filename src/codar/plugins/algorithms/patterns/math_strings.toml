'''

[[pattern]]
id = "algo.max_subarray"
title = "Subarray de soma máxima (Kadane)"
keywords = "kadane subarray soma maxima maximum subarray contiguo sequencia"
require = ["kadane", "subarray"]
tags = ["algorithm", "dp"]

[pattern.code]
python = '''
def soma_maxima(itens: list[int]) -> tuple[int, int, int]:
    """(soma, início, fim) do subarray contíguo de maior soma. O(n)."""
    if not itens:
        raise ValueError("lista vazia")
    melhor, atual = itens[0], itens[0]
    ini = melhor_ini = melhor_fim = 0
    for i in range(1, len(itens)):
        if atual < 0:
            atual, ini = itens[i], i
        else:
            atual += itens[i]
        if atual > melhor:
            melhor, melhor_ini, melhor_fim = atual, ini, i
    return melhor, melhor_ini, melhor_fim
'''
javascript = '''
function somaMaxima(itens) {
  let melhor = itens[0];
  let atual = itens[0];
  for (let i = 1; i < itens.length; i++) {
    atual = Math.max(itens[i], atual + itens[i]);
    melhor = Math.max(melhor, atual);
  }
  return melhor;
}
'''
go = '''
func somaMaxima(itens []int) int {
	melhor, atual := itens[0], itens[0]
	for _, x := range itens[1:] {
		atual = max(x, atual+x)
		melhor = max(melhor, atual)
	}
	return melhor
}
'''

[pattern.test]
