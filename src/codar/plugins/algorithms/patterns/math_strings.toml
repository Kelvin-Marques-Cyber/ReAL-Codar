[[pattern]]
id = "algo.base_conversion"
title = "Conversão entre bases numéricas"
keywords = "converter base binario hexadecimal octal decimal numerica conversao bases"
require = ["base", "binario", "hexadecimal", "octal"]
tags = ["algorithm", "math"]

[pattern.code]
python = '''
DIGITOS = "0123456789abcdefghijklmnopqrstuvwxyz"


def para_base(n: int, base: int) -> str:
    """Inteiro -> texto na base 2..36 (bin(), oct(), hex() cobrem 2, 8 e 16)."""
    if not 2 <= base <= 36:
        raise ValueError("base entre 2 e 36")
    if n == 0:
        return "0"
    sinal, n = ("-", -n) if n < 0 else ("", n)
    partes = []
    while n:
        n, r = divmod(n, base)
        partes.append(DIGITOS[r])
    return sinal + "".join(reversed(partes))


def de_base(texto: str, base: int) -> int:
    return int(texto, base)
'''
javascript = '''
const paraBase = (n, base) => BigInt(n).toString(base);
const deBase = (texto, base) => parseInt(texto, base);
'''

[pattern.test]
python = '''
assert para_base(255, 16) == "ff" and para_base(-5, 2) == "-101" and de_base("777", 8) == 511
'''
