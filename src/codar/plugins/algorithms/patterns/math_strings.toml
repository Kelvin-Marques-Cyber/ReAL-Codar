[[pattern]]
id = "algo.roman_numerals"
title = "Números romanos (converter de/para)"
keywords = "numeros romanos roman numerals converter inteiro romano"
require = ["romanos", "roman", "romano"]
tags = ["algorithm", "string"]

[pattern.code]
python = '''
_VALORES = [(1000, "M"), (900, "CM"), (500, "D"), (400, "CD"), (100, "C"), (90, "XC"),
            (50, "L"), (40, "XL"), (10, "X"), (9, "IX"), (5, "V"), (4, "IV"), (1, "I")]


def para_romano(n: int) -> str:
    if not 0 < n < 4000:
        raise ValueError("romanos clássicos vão de 1 a 3999")
    partes = []
    for valor, simbolo in _VALORES:
        qtd, n = divmod(n, valor)
        partes.append(simbolo * qtd)
    return "".join(partes)


def de_romano(s: str) -> int:
    simbolos = {"I": 1, "V": 5, "X": 10, "L": 50, "C": 100, "D": 500, "M": 1000}
    total = 0
    for i, ch in enumerate(s.upper()):
        valor = simbolos[ch]
        proximo = simbolos.get(s.upper()[i + 1], 0) if i + 1 < len(s) else 0
        total += -valor if valor < proximo else valor
    if para_romano(total) != s.upper():
        raise ValueError(f"numeral romano inválido: {s}")
    return total
'''
javascript = '''
const VALORES = [[1000, "M"], [900, "CM"], [500, "D"], [400, "CD"], [100, "C"], [90, "XC"],
  [50, "L"], [40, "XL"], [10, "X"], [9, "IX"], [5, "V"], [4, "IV"], [1, "I"]];

function paraRomano(n) {
  if (!Number.isInteger(n) || n <= 0 || n >= 4000) throw new RangeError("1 a 3999");
  let s = "";
  for (const [valor, simbolo] of VALORES) {
    while (n >= valor) {
      s += simbolo;
      n -= valor;
    }
  }
  return s;
}

function deRomano(s) {
  const v = { I: 1, V: 5, X: 10, L: 50, C: 100, D: 500, M: 1000 };
  const u = s.toUpperCase();
  let total = 0;
  for (let i = 0; i < u.length; i++) {
    const atual = v[u[i]];
    if (atual === undefined) throw new Error(`símbolo inválido: ${u[i]}`);
    total += atual < (v[u[i + 1]] ?? 0) ? -atual : atual;
  }
  if (paraRomano(total) !== u) throw new Error(`numeral romano inválido: ${s}`);
  return total;
}
'''

[pattern.test]
python = '''
assert para_romano(1994) == "MCMXCIV" and de_romano("MCMXCIV") == 1994 and de_romano("iv") == 4
try:
    de_romano("IIII")
    raise AssertionError("aceitou inválido")
except ValueError:
    pass
'''
javascript = '''
if (paraRomano(1994) !== "MCMXCIV" || deRomano("MMXXVI") !== 2026) throw new Error("falhou");
'''

[[pattern]]
id = "algo.balanced_brackets"
title = "Parênteses/colchetes balanceados"
keywords = "parenteses balanceados colchetes chaves validar expressao pilha brackets balanced"
require = ["balanceados", "balanced", "parenteses", "brackets"]
tags = ["algorithm", "string", "stack"]

[pattern.code]
python = '''
def balanceado(texto: str) -> bool:
    pares = {")": "(", "]": "[", "}": "{"}
    pilha = []
    for ch in texto:
        if ch in "([{":
            pilha.append(ch)
        elif ch in pares:
            if not pilha or pilha.pop() != pares[ch]:
                return False
    return not pilha
'''
javascript = '''
function balanceado(texto) {
  const pares = { ")": "(", "]": "[", "}": "{" };
  const pilha = [];
  for (const ch of texto) {
    if ("([{".includes(ch)) pilha.push(ch);
    else if (ch in pares && pilha.pop() !== pares[ch]) return false;
  }
  return pilha.length === 0;
}
'''
go = '''
func balanceado(texto string) bool {
	pares := map[rune]rune{')': '(', ']': '[', '}': '{'}
	var pilha []rune
	for _, ch := range texto {
		switch ch {
		case '(', '[', '{':
			pilha = append(pilha, ch)
		case ')', ']', '}':
			if len(pilha) == 0 || pilha[len(pilha)-1] != pares[ch] {
				return false
			}
			pilha = pilha[:len(pilha)-1]
		}
	}
	return len(pilha) == 0
}
'''
java = '''
static boolean balanceado(String texto) {
    var pilha = new java.util.ArrayDeque<Character>();
    for (char ch : texto.toCharArray()) {
        switch (ch) {
            case '(', '[', '{' -> pilha.push(ch);
            case ')' -> { if (pilha.isEmpty() || pilha.pop() != '(') return false; }
            case ']' -> { if (pilha.isEmpty() || pilha.pop() != '[') return false; }
            case '}' -> { if (pilha.isEmpty() || pilha.pop() != '{') return false; }
            default -> { }
        }
    }
    return pilha.isEmpty();
}
'''

[pattern.test]
