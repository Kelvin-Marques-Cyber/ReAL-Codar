[[pattern]]
id = "algo.topological_sort"
title = "Ordenação topológica (Kahn)"
keywords = "ordenacao topologica topological sort kahn dependencias dag grafo aciclico ordem build tarefas"
require = ["topologica", "topological", "dependencias"]
tags = ["algorithm", "graph"]

[pattern.code]
python = '''
from collections import deque


def ordem_topologica(deps: dict) -> list:
    """deps = {tarefa: [pré-requisitos]}. Levanta ValueError se houver ciclo. O(V + E)."""
    nos = set(deps) | {p for ps in deps.values() for p in ps}
    entrada = {n: 0 for n in nos}
    saida = {n: [] for n in nos}
    for tarefa, pres in deps.items():
        for p in pres:
            saida[p].append(tarefa)
            entrada[tarefa] += 1
    fila = deque(sorted(n for n in nos if entrada[n] == 0))
    ordem = []
    while fila:
        n = fila.popleft()
        ordem.append(n)
        for m in saida[n]:
            entrada[m] -= 1
            if entrada[m] == 0:
                fila.append(m)
    if len(ordem) != len(nos):
        raise ValueError("dependência circular")
    return ordem
'''
javascript = '''
/** deps: { tarefa: [pré-requisitos] }. Lança erro se houver ciclo. */
function ordemTopologica(deps) {
  const nos = new Set(Object.keys(deps));
  for (const ps of Object.values(deps)) ps.forEach((p) => nos.add(p));
  const entrada = new Map([...nos].map((n) => [n, 0]));
  const saida = new Map([...nos].map((n) => [n, []]));
  for (const [tarefa, pres] of Object.entries(deps)) {
    for (const p of pres) {
      saida.get(p).push(tarefa);
      entrada.set(tarefa, entrada.get(tarefa) + 1);
    }
  }
  const fila = [...nos].filter((n) => entrada.get(n) === 0).sort();
  const ordem = [];
  while (fila.length) {
    const n = fila.shift();
    ordem.push(n);
    for (const m of saida.get(n)) {
      entrada.set(m, entrada.get(m) - 1);
      if (entrada.get(m) === 0) fila.push(m);
    }
  }
  if (ordem.length !== nos.size) throw new Error("dependência circular");
  return ordem;
}
'''
go = '''
import "errors"

// ordemTopologica recebe deps[tarefa] = pré-requisitos e devolve uma ordem válida (erro se houver ciclo).
func ordemTopologica(deps map[string][]string) ([]string, error) {
	entrada := map[string]int{}
	saida := map[string][]string{}
	for tarefa, pres := range deps {
		if _, ok := entrada[tarefa]; !ok {
			entrada[tarefa] = 0
		}
		for _, p := range pres {
			if _, ok := entrada[p]; !ok {
				entrada[p] = 0
			}
			saida[p] = append(saida[p], tarefa)
			entrada[tarefa]++
		}
	}
	var fila, ordem []string
	for n, g := range entrada {
		if g == 0 {
			fila = append(fila, n)
		}
	}
	for len(fila) > 0 {
		n := fila[0]
		fila = fila[1:]
		ordem = append(ordem, n)
		for _, m := range saida[n] {
			entrada[m]--
			if entrada[m] == 0 {
				fila = append(fila, m)
			}
		}
	}
	if len(ordem) != len(entrada) {
		return nil, errors.New("dependência circular")
	}
	return ordem, nil
}
'''

[pattern.test]
python = '''
o = ordem_topologica({"app": ["lib", "util"], "lib": ["util"], "util": []})
assert o.index("util") < o.index("lib") < o.index("app")
try:
    ordem_topologica({"a": ["b"], "b": ["a"]})
    raise AssertionError("ciclo não detectado")
except ValueError:
    pass
'''
javascript = '''
const o = ordemTopologica({ app: ["lib", "util"], lib: ["util"], util: [] });
if (!(o.indexOf("util") < o.indexOf("lib") && o.indexOf("lib") < o.indexOf("app"))) throw new Error("falhou");
let ciclo = false;
try { ordemTopologica({ a: ["b"], b: ["a"] }); } catch { ciclo = true; }
if (!ciclo) throw new Error("ciclo não detectado");
'''

[[pattern]]
id = "algo.astar"
title = "A* em grade (pathfinding)"
keywords = "a star astar pathfinding caminho grade grid mapa jogo heuristica manhattan obstaculos"
require = ["astar", "pathfinding", "star"]
tags = ["algorithm", "graph", "games"]

[pattern.code]
python = '''
import heapq


def a_estrela(grade: list[str], inicio: tuple[int, int], fim: tuple[int, int]) -> list[tuple[int, int]] | None:
    """grade: linhas de texto, '#' = parede. Movimento em 4 direções, heurística de Manhattan."""
    linhas, colunas = len(grade), len(grade[0])

    def h(p):
        return abs(p[0] - fim[0]) + abs(p[1] - fim[1])

    aberto = [(h(inicio), 0, inicio)]
    custo = {inicio: 0}
    anterior = {}
    while aberto:
        _, g, atual = heapq.heappop(aberto)
        if atual == fim:
            caminho = [atual]
            while atual in anterior:
                atual = anterior[atual]
                caminho.append(atual)
            return caminho[::-1]
        if g > custo[atual]:
            continue
        r, c = atual
        for viz in ((r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1)):
            vr, vc = viz
            if 0 <= vr < linhas and 0 <= vc < colunas and grade[vr][vc] != "#":
                ng = g + 1
                if ng < custo.get(viz, float("inf")):
                    custo[viz] = ng
                    anterior[viz] = atual
                    heapq.heappush(aberto, (ng + h(viz), ng, viz))
    return None
'''

[pattern.test]
python = '''
grade = ["....", ".##.", "...."]
c = a_estrela(grade, (0, 0), (2, 3))
assert c[0] == (0, 0) and c[-1] == (2, 3) and len(c) == 6
assert a_estrela([".#", "#."], (0, 0), (1, 1)) is None
'''

[[pattern]]
id = "algo.kruskal"
title = "Árvore geradora mínima (Kruskal)"
keywords = "arvore geradora minima minimum spanning tree mst kruskal union find custo rede"
require = ["kruskal", "mst", "geradora", "spanning"]
tags = ["algorithm", "graph"]

[pattern.code]
python = '''
def kruskal(n: int, arestas: list[tuple[int, int, float]]) -> tuple[float, list]:
    """Vértices 0..n-1, arestas (u, v, peso). Devolve (custo total, arestas escolhidas)."""
    pai = list(range(n))

    def raiz(x: int) -> int:
        while pai[x] != x:
            pai[x] = pai[pai[x]]  # compressão de caminho
            x = pai[x]
        return x

    total, escolhidas = 0.0, []
    for u, v, peso in sorted(arestas, key=lambda a: a[2]):
        ru, rv = raiz(u), raiz(v)
        if ru != rv:
            pai[ru] = rv
            total += peso
            escolhidas.append((u, v, peso))
    return total, escolhidas
'''

[pattern.test]
python = '''
total, arestas = kruskal(4, [(0, 1, 1), (1, 2, 2), (0, 2, 3), (2, 3, 1)])
assert total == 4 and len(arestas) == 3
'''
