assert bfs_caminho(g, "a", "f") in (["a", "b", "d", "f"], ["a", "c", "d", "f"], ["a", "c", "e", "f"])
assert bfs_caminho(g, "f", "a") is None and bfs_caminho(g, "a", "a") == ["a"]
'''
