[[pattern]]
id = "algo.dfs"
title = "Busca em profundidade (DFS) iterativa"
keywords = "dfs busca profundidade depth first grafo grafos alcancaveis componentes pilha visitar"
require = ["dfs", "profundidade", "depth"]
tags = ["algorithm", "graph"]

[pattern.code]
python = '''
def dfs(grafo: dict, inicio) -> list:
    """Ordem de visita a partir de inicio. Pilha explícita: sem RecursionError em grafos grandes."""
    visitados, ordem, pilha = set(), [], [inicio]
    while pilha:
        no = pilha.pop()
        if no in visitados:
            continue
        visitados.add(no)
        ordem.append(no)
        pilha.extend(reversed(grafo.get(no, ())))
    return ordem
'''
javascript = '''
function dfs(grafo, inicio) {
  const visitados = new Set();
  const ordem = [];
  const pilha = [inicio];
  while (pilha.length) {
    const no = pilha.pop();
    if (visitados.has(no)) continue;
    visitados.add(no);
    ordem.push(no);
    const vizinhos = grafo.get(no) ?? [];
    for (let i = vizinhos.length - 1; i >= 0; i--) pilha.push(vizinhos[i]);
  }
  return ordem;
}
'''
go = '''
func dfs(grafo map[string][]string, inicio string) []string {
	visitados := map[string]bool{}
	var ordem []string
	pilha := []string{inicio}
	for len(pilha) > 0 {
		no := pilha[len(pilha)-1]
		pilha = pilha[:len(pilha)-1]
		if visitados[no] {
			continue
		}
		visitados[no] = true
		ordem = append(ordem, no)
		viz := grafo[no]
		for i := len(viz) - 1; i >= 0; i-- {
			pilha = append(pilha, viz[i])
		}
	}
	return ordem
}
'''

[pattern.test]
python = '''
g = {1: [2, 3], 2: [4], 3: [4], 4: []}
assert dfs(g, 1) == [1, 2, 4, 3]
'''
javascript = '''
const g = new Map([[1, [2, 3]], [2, [4]], [3, [4]], [4, []]]);
if (dfs(g, 1).join() !== "1,2,4,3") throw new Error("falhou");
'''

[[pattern]]
id = "algo.dijkstra"
title = "Dijkstra (menor caminho com pesos)"
keywords = "dijkstra menor caminho pesos grafo ponderado shortest path weighted distancia rota heap"
require = ["dijkstra", "ponderado", "weighted", "pesos"]
tags = ["algorithm", "graph"]

[pattern.code]
python = '''
import heapq


def dijkstra(grafo: dict, inicio) -> tuple[dict, dict]:
    """grafo = {no: [(vizinho, peso), ...]} com pesos >= 0.
    Devolve (distancias, anterior); reconstrua o caminho seguindo `anterior`. O((V + E) log V)."""
    dist = {inicio: 0}
    anterior = {}
    heap = [(0, inicio)]
    while heap:
        d, no = heapq.heappop(heap)
        if d > dist.get(no, float("inf")):
            continue  # entrada obsoleta no heap
        for viz, peso in grafo.get(no, ()):
            nd = d + peso
            if nd < dist.get(viz, float("inf")):
                dist[viz] = nd
                anterior[viz] = no
                heapq.heappush(heap, (nd, viz))
    return dist, anterior


def caminho(anterior: dict, inicio, fim) -> list:
    if fim != inicio and fim not in anterior:
        return []
    c = [fim]
    while c[-1] != inicio:
        c.append(anterior[c[-1]])
    return c[::-1]
'''
javascript = '''
/** grafo: Map<no, [vizinho, peso][]> (pesos >= 0). Devolve {dist, anterior}. Heap binário mínimo embutido. */
function dijkstra(grafo, inicio) {
  const dist = new Map([[inicio, 0]]);
  const anterior = new Map();
  const heap = [[0, inicio]];
  const subir = (i) => {
    while (i > 0) {
      const p = (i - 1) >> 1;
      if (heap[p][0] <= heap[i][0]) break;
      [heap[p], heap[i]] = [heap[i], heap[p]];
      i = p;
    }
  };
  const tirar = () => {
    const topo = heap[0];
    const ultimo = heap.pop();
    if (heap.length) {
      heap[0] = ultimo;
      let i = 0;
      for (;;) {
        const e = 2 * i + 1;
        const d = e + 1;
        let m = i;
        if (e < heap.length && heap[e][0] < heap[m][0]) m = e;
        if (d < heap.length && heap[d][0] < heap[m][0]) m = d;
        if (m === i) break;
        [heap[m], heap[i]] = [heap[i], heap[m]];
        i = m;
      }
    }
    return topo;
  };
  while (heap.length) {
    const [d, no] = tirar();
    if (d > (dist.get(no) ?? Infinity)) continue;
    for (const [viz, peso] of grafo.get(no) ?? []) {
      const nd = d + peso;
      if (nd < (dist.get(viz) ?? Infinity)) {
        dist.set(viz, nd);
        anterior.set(viz, no);
        heap.push([nd, viz]);
        subir(heap.length - 1);
      }
    }
  }
  return { dist, anterior };
}
'''
go = '''
import "container/heap"

type aresta struct {
	para string
	peso int
}

type item struct {
	no   string
	dist int
}

type filaPrioridade []item

func (f filaPrioridade) Len() int            { return len(f) }
func (f filaPrioridade) Less(i, j int) bool  { return f[i].dist < f[j].dist }
func (f filaPrioridade) Swap(i, j int)       { f[i], f[j] = f[j], f[i] }
func (f *filaPrioridade) Push(x any)         { *f = append(*f, x.(item)) }
func (f *filaPrioridade) Pop() any           { v := (*f)[len(*f)-1]; *f = (*f)[:len(*f)-1]; return v }

// dijkstra devolve as menores distâncias a partir de inicio (pesos >= 0).
func dijkstra(grafo map[string][]aresta, inicio string) map[string]int {
	dist := map[string]int{inicio: 0}
	fila := &filaPrioridade{{inicio, 0}}
	for fila.Len() > 0 {
		atual := heap.Pop(fila).(item)
		if d, ok := dist[atual.no]; ok && atual.dist > d {
			continue
		}
		for _, a := range grafo[atual.no] {
			nd := atual.dist + a.peso
			if d, ok := dist[a.para]; !ok || nd < d {
				dist[a.para] = nd
				heap.Push(fila, item{a.para, nd})
			}
		}
	}
	return dist
}
'''
rust = '''
use std::cmp::Reverse;
use std::collections::{BinaryHeap, HashMap};

/// Menores distâncias a partir de `inicio`; grafo: no -> [(vizinho, peso)].
fn dijkstra(grafo: &HashMap<usize, Vec<(usize, u64)>>, inicio: usize) -> HashMap<usize, u64> {
    let mut dist = HashMap::from([(inicio, 0u64)]);
    let mut heap = BinaryHeap::from([Reverse((0u64, inicio))]);
    while let Some(Reverse((d, no))) = heap.pop() {
        if d > *dist.get(&no).unwrap_or(&u64::MAX) {
            continue;
        }
        for &(viz, peso) in grafo.get(&no).into_iter().flatten() {
            let nd = d + peso;
            if nd < *dist.get(&viz).unwrap_or(&u64::MAX) {
                dist.insert(viz, nd);
                heap.push(Reverse((nd, viz)));
            }
        }
    }
    dist
}
'''
java = '''
/** Menores distâncias a partir de inicio. grafo: no -> lista de {vizinho, peso}. */
static java.util.Map<Integer, Integer> dijkstra(java.util.Map<Integer, java.util.List<int[]>> grafo, int inicio) {
    var dist = new java.util.HashMap<Integer, Integer>();
    dist.put(inicio, 0);
    var fila = new java.util.PriorityQueue<int[]>(java.util.Comparator.comparingInt(a -> a[1]));
    fila.add(new int[] {inicio, 0});
    while (!fila.isEmpty()) {
        int[] atual = fila.poll();
        if (atual[1] > dist.getOrDefault(atual[0], Integer.MAX_VALUE)) {
            continue;
        }
        for (int[] aresta : grafo.getOrDefault(atual[0], java.util.List.of())) {
            int nd = atual[1] + aresta[1];
            if (nd < dist.getOrDefault(aresta[0], Integer.MAX_VALUE)) {
                dist.put(aresta[0], nd);
                fila.add(new int[] {aresta[0], nd});
            }
        }
    }
    return dist;
}
'''
csharp = '''
/// <summary>Menores distâncias a partir de inicio. grafo: no -> (vizinho, peso).</summary>
static Dictionary<int, int> Dijkstra(Dictionary<int, List<(int Viz, int Peso)>> grafo, int inicio)
{
    var dist = new Dictionary<int, int> { [inicio] = 0 };
    var fila = new PriorityQueue<int, int>();
    fila.Enqueue(inicio, 0);
    while (fila.TryDequeue(out int no, out int d))
    {
        if (d > dist.GetValueOrDefault(no, int.MaxValue)) continue;
        foreach (var (viz, peso) in grafo.GetValueOrDefault(no, new()))
        {
            int nd = d + peso;
            if (nd < dist.GetValueOrDefault(viz, int.MaxValue))
            {
                dist[viz] = nd;
                fila.Enqueue(viz, nd);
            }
        }
    }
    return dist;
}
'''

