# Grafos: representação por lista de adjacência (dict/Map/map), sem recursão profunda (pilha explícita).

[[pattern]]
id = "algo.bfs"
title = "Busca em largura (BFS) e menor caminho sem pesos"
keywords = "bfs busca largura breadth first grafo grafos menor caminho shortest path sem peso fila"
require = ["bfs", "largura", "breadth"]
tags = ["algorithm", "graph"]

[pattern.code]
python = '''
from collections import deque


def bfs_caminho(grafo: dict, inicio, fim) -> list | None:
    """Menor caminho (em número de arestas) de inicio a fim, ou None. O(V + E)."""
    anterior = {inicio: None}
    fila = deque([inicio])
    while fila:
        no = fila.popleft()
        if no == fim:
            caminho = []
            while no is not None:
                caminho.append(no)
                no = anterior[no]
            return caminho[::-1]
        for vizinho in grafo.get(no, ()):
            if vizinho not in anterior:
                anterior[vizinho] = no
                fila.append(vizinho)
    return None
'''
javascript = '''
/** Menor caminho (em arestas) de inicio a fim em grafo Map<no, nos[]>, ou null. O(V + E). */
function bfsCaminho(grafo, inicio, fim) {
  const anterior = new Map([[inicio, null]]);
  const fila = [inicio];
  for (let i = 0; i < fila.length; i++) {
    const no = fila[i];
    if (no === fim) {
      const caminho = [];
      for (let n = no; n !== null; n = anterior.get(n)) caminho.push(n);
      return caminho.reverse();
    }
    for (const viz of grafo.get(no) ?? []) {
      if (!anterior.has(viz)) {
        anterior.set(viz, no);
        fila.push(viz);
      }
    }
  }
  return null;
}
'''
go = '''
// bfsCaminho devolve o menor caminho (em arestas) de inicio a fim, ou nil. O(V + E).
func bfsCaminho(grafo map[string][]string, inicio, fim string) []string {
	anterior := map[string]string{inicio: ""}
	fila := []string{inicio}
	for len(fila) > 0 {
		no := fila[0]
		fila = fila[1:]
		if no == fim {
			var caminho []string
			for n := no; n != ""; n = anterior[n] {
				caminho = append([]string{n}, caminho...)
			}
			return caminho
		}
		for _, viz := range grafo[no] {
			if _, visto := anterior[viz]; !visto {
				anterior[viz] = no
				fila = append(fila, viz)
			}
		}
	}
	return nil
}
'''
java = '''
/** Menor caminho (em arestas) de inicio a fim, ou lista vazia. O(V + E). */
static java.util.List<String> bfsCaminho(java.util.Map<String, java.util.List<String>> grafo, String inicio, String fim) {
    var anterior = new java.util.HashMap<String, String>();
    anterior.put(inicio, null);
    var fila = new java.util.ArrayDeque<String>();
    fila.add(inicio);
    while (!fila.isEmpty()) {
        String no = fila.poll();
        if (no.equals(fim)) {
            var caminho = new java.util.LinkedList<String>();
            for (String n = no; n != null; n = anterior.get(n)) {
                caminho.addFirst(n);
            }
            return caminho;
        }
        for (String viz : grafo.getOrDefault(no, java.util.List.of())) {
            if (!anterior.containsKey(viz)) {
                anterior.put(viz, no);
                fila.add(viz);
            }
        }
    }
    return java.util.List.of();
}
'''
rust = '''
use std::collections::{HashMap, VecDeque};

/// Menor caminho (em arestas) de `inicio` a `fim`, ou None. O(V + E).
fn bfs_caminho<'a>(grafo: &HashMap<&'a str, Vec<&'a str>>, inicio: &'a str, fim: &'a str) -> Option<Vec<&'a str>> {
    let mut anterior: HashMap<&str, Option<&str>> = HashMap::from([(inicio, None)]);
    let mut fila = VecDeque::from([inicio]);
    while let Some(no) = fila.pop_front() {
        if no == fim {
            let mut caminho = vec![no];
            let mut atual = no;
            while let Some(Some(prev)) = anterior.get(atual) {
                caminho.push(prev);
                atual = prev;
            }
            caminho.reverse();
            return Some(caminho);
        }
        for &viz in grafo.get(no).into_iter().flatten() {
            if !anterior.contains_key(viz) {
                anterior.insert(viz, Some(no));
                fila.push_back(viz);
            }
        }
    }
    None
}
'''

