[[pattern]]
id = "algo.binary_search"
title = "Busca binária"
keywords = "busca binaria binary search pesquisa lista ordenada indice log n bisect"
require = ["binaria", "binary", "bisect"]
tags = ["algorithm", "search"]

[pattern.code]
python = '''
def busca_binaria(itens: list, alvo) -> int:
    """Índice de `alvo` em `itens` (ordenada) ou -1. O(log n)."""
    lo, hi = 0, len(itens) - 1
    while lo <= hi:
        meio = (lo + hi) // 2
        if itens[meio] == alvo:
            return meio
        if itens[meio] < alvo:
            lo = meio + 1
        else:
            hi = meio - 1
    return -1
'''
