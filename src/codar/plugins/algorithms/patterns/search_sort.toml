go = '''
// buscaBinaria retorna o índice de alvo em itens (ordenado) ou -1. O(log n).
// Na biblioteca padrão: slices.BinarySearch(itens, alvo).
func buscaBinaria(itens []int, alvo int) int {
	lo, hi := 0, len(itens)-1
	for lo <= hi {
		meio := lo + (hi-lo)/2
		switch {
		case itens[meio] == alvo:
			return meio
		case itens[meio] < alvo:
			lo = meio + 1
		default:
			hi = meio - 1
		}
	}
	return -1
}
'''
rust = '''
/// Índice de `alvo` em `itens` (ordenado). Na std: `itens.binary_search(&alvo).ok()`.
fn busca_binaria<T: Ord>(itens: &[T], alvo: &T) -> Option<usize> {
    let (mut lo, mut hi) = (0usize, itens.len());
    while lo < hi {
        let meio = lo + (hi - lo) / 2;
        match itens[meio].cmp(alvo) {
            std::cmp::Ordering::Equal => return Some(meio),
            std::cmp::Ordering::Less => lo = meio + 1,
            std::cmp::Ordering::Greater => hi = meio,
        }
    }
    None
}
'''
