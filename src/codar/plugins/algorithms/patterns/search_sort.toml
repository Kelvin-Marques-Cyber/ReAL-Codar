  while (lo <= hi) {
    const meio = (lo + hi) >>> 1;
    if (itens[meio] === alvo) return meio;
    if (itens[meio] < alvo) lo = meio + 1;
    else hi = meio - 1;
  }
  return -1;
}
'''
