[[estrutura]]
id = "python-pacote"
titulo = "Pacote Python (layout src)"
descricao = "pyproject.toml, pacote em src/, testes com pytest e .gitignore."
palavras = "python pacote biblioteca package lib cli aplicacao src pytest"
pastas = ["src/{{pacote}}", "tests"]
[estrutura.arquivos]
"pyproject.toml" = '''
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "{{nome}}"
version = "0.1.0"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
'''
