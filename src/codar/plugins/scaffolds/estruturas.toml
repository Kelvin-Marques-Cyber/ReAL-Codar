# Estruturas de projeto: pastas e arquivos iniciais criados pelo botão ESTRUTURA, por `codar project scaffold`
# ou por "crie a estrutura de um projeto …". Nada existente é sobrescrito.
# {{nome}} é o nome do projeto (minha-loja) e {{pacote}} a forma válida como identificador (minha_loja).
# Arquivos de entrada de linguagens compiladas têm o mínimo que compila; os demais ficam vazios.

[[estrutura]]
id = "fullstack-ts"
titulo = "Full Stack TypeScript (Node + navegador)"
descricao = "Servidor, cliente e tipos compartilhados em src/, testes e configuração TypeScript."
palavras = "full stack fullstack typescript ts node servidor backend frontend cliente web api"
pastas = ["src/server/routes", "src/client", "src/shared", "public", "tests"]
[estrutura.arquivos]
"package.json" = '''
{
  "name": "{{nome}}",
  "version": "0.1.0",
  "private": true,
  "type": "module",
  "scripts": {
    "dev": "tsx watch src/server/index.ts",
    "build": "tsc -p .",
    "start": "node dist/server/index.js",
    "test": "node --test"
  }
}
'''
"tsconfig.json" = '''
{
  "compilerOptions": {
    "target": "ES2022",
    "module": "NodeNext",
    "moduleResolution": "NodeNext",
    "strict": true,
    "outDir": "dist",
    "rootDir": "src",
    "esModuleInterop": true,
    "skipLibCheck": true
  },
  "include": ["src"]
}
'''
"src/server/index.ts" = ""
"src/server/routes/index.ts" = ""
"src/client/index.html" = ""
"src/client/main.ts" = ""
"src/client/styles.css" = ""
"src/shared/types.ts" = ""
"tests/server.test.ts" = ""
".env.example" = ""
".gitignore" = '''
node_modules/
dist/
.env
'''
"README.md" = '''
# {{nome}}

Estrutura Full Stack TypeScript criada pelo CODAR.

Instale as ferramentas de desenvolvimento: `npm install -D typescript tsx @types/node`.
'''

