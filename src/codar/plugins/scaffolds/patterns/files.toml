[[pattern]]
id = "file.ci.node"
title = "GitHub Actions CI para Node"
kind = "file"
path = ".github/workflows/ci.yml"
keywords = "github actions ci pipeline integracao continua node npm workflow"
require = ["ci", "actions", "workflow"]
[pattern.code]
yaml = '''
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test --if-present
      - run: npm run build --if-present
'''

[[pattern]]
id = "file.ci.python"
title = "GitHub Actions CI para Python"
kind = "file"
path = ".github/workflows/ci.yml"
keywords = "github actions ci pipeline integracao continua python pytest workflow"
require = ["ci", "actions", "workflow"]
[pattern.code]
yaml = '''
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: if [ -f pyproject.toml ]; then pip install -e ".[dev]" || pip install -e .; else pip install -r requirements.txt; fi
      - run: python -m pip install pytest
      - run: python -m pytest -q
'''

[[pattern]]
id = "file.ci.go"
title = "GitHub Actions CI para Go"
kind = "file"
path = ".github/workflows/ci.yml"
keywords = "github actions ci pipeline integracao continua golang go workflow"
require = ["ci", "actions", "workflow"]
[pattern.code]
yaml = '''
name: ci

on:
