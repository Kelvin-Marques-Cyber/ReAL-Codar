[[pattern]]
id = "file.ci.powershell"
title = "GitHub Actions CI para PowerShell (Pester + PSScriptAnalyzer)"
kind = "file"
path = ".github/workflows/ci.yml"
keywords = "github actions ci pipeline integracao continua powershell pester workflow"
require = ["ci", "actions", "workflow"]
[pattern.code]
yaml = '''
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5 -Scope CurrentUser -Force
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - shell: pwsh
        run: Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error,Warning -EnableExit
      - shell: pwsh
        run: Invoke-Pester -CI
'''

[[pattern]]
id = "file.dockerfile.python"
title = "Dockerfile para Python (multi-stage, sem root)"
kind = "file"
path = "Dockerfile"
keywords = "dockerfile docker container imagem python"
require = ["dockerfile", "docker"]
slots = { port = "8000", module = "app" }
[pattern.code]
dockerfile = '''
# syntax=docker/dockerfile:1
FROM python:3.12-slim AS base
ENV PYTHONDONTWRITEBYTECODE=1 \
    PYTHONUNBUFFERED=1 \
    PIP_NO_CACHE_DIR=1
WORKDIR /app

FROM base AS deps
COPY requirements.txt .
RUN pip install --prefix=/install -r requirements.txt

FROM base
COPY --from=deps /install /usr/local
COPY . .
RUN useradd --system --uid 10001 app
USER app
EXPOSE {{port}}
CMD ["python", "-m", "{{module}}"]
'''

[[pattern]]
id = "file.dockerfile.node"
title = "Dockerfile para Node (multi-stage, sem root)"
kind = "file"
path = "Dockerfile"
keywords = "dockerfile docker container imagem node javascript"
require = ["dockerfile", "docker"]
slots = { port = "3000", entry = "index.js" }
[pattern.code]
dockerfile = '''
# syntax=docker/dockerfile:1
FROM node:22-slim AS deps
WORKDIR /app
COPY package.json package-lock.json* ./
RUN npm ci --omit=dev

FROM node:22-slim
ENV NODE_ENV=production
WORKDIR /app
COPY --from=deps /app/node_modules ./node_modules
COPY . .
USER node
EXPOSE {{port}}
CMD ["node", "{{entry}}"]
'''

[[pattern]]
id = "file.dockerfile.go"
title = "Dockerfile para Go (estático, distroless, sem root)"
kind = "file"
path = "Dockerfile"
keywords = "dockerfile docker container imagem golang go distroless"
require = ["dockerfile", "docker"]
slots = { pkg = "." }
[pattern.code]
dockerfile = '''
# syntax=docker/dockerfile:1
FROM golang:1.23 AS build
WORKDIR /src
COPY go.mod go.sum* ./
RUN go mod download
COPY . .
RUN CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /out/app {{pkg}}

FROM gcr.io/distroless/static-debian12:nonroot
COPY --from=build /out/app /app
USER nonroot:nonroot
ENTRYPOINT ["/app"]
'''

[[pattern]]
id = "file.compose.postgres_redis"
title = "docker compose com PostgreSQL e Redis"
kind = "file"
path = "compose.yaml"
keywords = "docker compose postgres postgresql redis banco cache desenvolvimento local"
require = ["compose"]
[pattern.code]
yaml = '''
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  pgdata:
'''

[[pattern]]
