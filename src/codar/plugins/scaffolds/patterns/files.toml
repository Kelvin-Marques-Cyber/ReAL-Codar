[[pattern]]
id = "file.ci.rust"
title = "GitHub Actions CI para Rust"
kind = "file"
path = ".github/workflows/ci.yml"
keywords = "github actions ci pipeline integracao continua rust cargo workflow"
require = ["ci", "actions", "workflow"]
[pattern.code]
yaml = '''
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
