path = "ruff.toml"
keywords = "ruff lint linter formatador python configuracao"
require = ["ruff"]
[pattern.code]
toml = '''
line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[lint.per-file-ignores]
"tests/**" = ["S"]
'''

