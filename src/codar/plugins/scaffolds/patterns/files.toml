            TargetVersions = @('5.1', '7.4')
        }
    }
}
'''

[[pattern]]
id = "file.pester.example"
title = "teste Pester de exemplo"
kind = "file"
path = "tests/Exemplo.Tests.ps1"
keywords = "pester teste powershell unitario exemplo"
require = ["pester"]
[pattern.code]
powershell = '''
Describe 'Exemplo' {
    It 'soma dois números' {
        $resultado = 2 + 3
        $resultado | Should -Be 5
    }

    It 'lança erro com entrada inválida' {
        { [int]::Parse('abc') } | Should -Throw
    }
}
'''

