import pytest


def test_soma():
    assert 2 + 3 == 5


@pytest.mark.parametrize(("entrada", "esperado"), [("a", "A"), ("abc", "ABC")])
def test_maiusculas(entrada, esperado):
    assert entrada.upper() == esperado
'''

