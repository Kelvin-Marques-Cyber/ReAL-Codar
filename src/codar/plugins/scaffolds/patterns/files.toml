[[pattern]]
id = "file.precommit.python"
title = "pre-commit para Python (ruff + verificações)"
kind = "file"
path = ".pre-commit-config.yaml"
keywords = "pre-commit hooks git python ruff"
require = ["precommit", "pre-commit"]
[pattern.code]
yaml = '''
# Rode `pre-commit autoupdate` para atualizar as versões.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
'''

