# Arquivos: gravação que nunca deixa o arquivo pela metade, leitura de arquivos grandes sem estourar a memória e busca
# recursiva que não entra em node_modules/.git.

[[pattern]]
id = "io.atomic_write"
title = "Gravar arquivo de forma atômica (nunca pela metade)"
keywords = "gravar salvar escrever arquivo atomico atomica atomicamente seguro temporario substituir sem corromper"
require = ["atomico", "atomica", "atomicamente", "atomic", "atomically"]
tags = ["io", "best-practice", "reliability"]

[pattern.code]
python = '''
import os
import tempfile
from pathlib import Path


def gravar_atomico(caminho: str | os.PathLike, conteudo: str | bytes, encoding: str = "utf-8") -> None:
    """Grava num temporário da mesma pasta e troca de uma vez (os.replace): quem lê vê o arquivo antigo ou o novo,
    nunca um pela metade, mesmo se o programa cair ou faltar energia no meio. Preserva as permissões."""
    destino = Path(caminho)
    dados = conteudo.encode(encoding) if isinstance(conteudo, str) else conteudo
    modo = destino.stat().st_mode & 0o7777 if destino.exists() else 0o644
    fd, tmp = tempfile.mkstemp(dir=destino.parent, prefix=f".{destino.name}.", suffix=".tmp")
    try:
        with os.fdopen(fd, "wb") as f:
            f.write(dados)
            f.flush()
            os.fsync(f.fileno())  # os bytes chegam ao disco antes da troca
        os.chmod(tmp, modo)
        os.replace(tmp, destino)
    except BaseException:
        Path(tmp).unlink(missing_ok=True)
        raise
    if os.name == "posix":  # grava também a entrada do diretório (a troca em si) no disco
        pasta = os.open(destino.parent, os.O_RDONLY)
        try:
            os.fsync(pasta)
        finally:
            os.close(pasta)
'''
javascript = '''
import { randomBytes } from "node:crypto";
import { chmod, open, rename, rm, stat } from "node:fs/promises";
import { basename, dirname, join } from "node:path";

/** Grava num temporário da mesma pasta e troca de uma vez: quem lê nunca vê o arquivo pela metade. */
export async function gravarAtomico(caminho, conteudo) {
  const tmp = join(dirname(caminho), `.${basename(caminho)}.${randomBytes(6).toString("hex")}.tmp`);
  let modo = 0o644;
  try {
    modo = (await stat(caminho)).mode & 0o7777; // preserva as permissões do arquivo que será substituído
  } catch {
    // arquivo novo
  }
  try {
    const arquivo = await open(tmp, "wx", modo);
    try {
      await arquivo.writeFile(conteudo);
      await arquivo.sync(); // os bytes chegam ao disco antes da troca
    } finally {
      await arquivo.close();
    }
    await chmod(tmp, modo); // o umask pode ter reduzido as permissões na criação
    await rename(tmp, caminho);
  } catch (err) {
    await rm(tmp, { force: true });
    throw err;
  }
}
'''
go = '''
package main

import (
	"os"
	"path/filepath"
)

// GravarAtomico grava num temporário da mesma pasta e troca de uma vez (os.Rename): quem lê vê o arquivo antigo ou
// o novo, nunca um pela metade. Preserva as permissões do arquivo substituído.
func GravarAtomico(caminho string, dados []byte) (err error) {
	modo := os.FileMode(0o644)
	if info, e := os.Stat(caminho); e == nil {
		modo = info.Mode().Perm()
	}
	tmp, err := os.CreateTemp(filepath.Dir(caminho), "."+filepath.Base(caminho)+".*.tmp")
	if err != nil {
		return err
	}
	defer func() {
		if err != nil {
			os.Remove(tmp.Name())
		}
	}()
	if _, err = tmp.Write(dados); err != nil {
		tmp.Close()
		return err
	}
	if err = tmp.Sync(); err != nil { // os bytes chegam ao disco antes da troca
		tmp.Close()
		return err
	}
	if err = tmp.Close(); err != nil {
		return err
	}
	if err = os.Chmod(tmp.Name(), modo); err != nil {
		return err
	}
	return os.Rename(tmp.Name(), caminho)
}
'''
bash = '''
# gravar_atomico ARQUIVO < conteúdo: grava num temporário da mesma pasta e troca de uma vez (mv na mesma partição é
# atômico); quem lê nunca vê o arquivo pela metade. Preserva as permissões do arquivo substituído.
gravar_atomico() {
  local destino="$1" tmp
  tmp="$(mktemp "$(dirname -- "$destino")/.$(basename -- "$destino").XXXXXX")" || return 1
  if ! cat > "$tmp"; then
    rm -f -- "$tmp"
    return 1
  fi
  if [[ -e "$destino" ]]; then
    chmod "$(stat -c %a -- "$destino")" -- "$tmp"
  else
    chmod 644 -- "$tmp"
  fi
  sync -- "$tmp" 2>/dev/null || true  # os bytes chegam ao disco antes da troca
  mv -f -- "$tmp" "$destino"
}
'''
powershell = '''
function Set-ConteudoAtomico {
    <#
    .SYNOPSIS
    Grava num temporário da mesma pasta e troca de uma vez: quem lê nunca vê o arquivo pela metade.
    Funciona no Windows PowerShell 5.1 e no PowerShell 7.
    #>
    [CmdletBinding()]
    param(
        [Parameter(Mandatory)][string]$Path,
        [Parameter(Mandatory)][AllowEmptyString()][string]$Value
    )
    $destino = $PSCmdlet.GetUnresolvedProviderPathFromPSPath($Path)
    $nome = [System.IO.Path]::GetFileName($destino)
    $tmp = Join-Path ([System.IO.Path]::GetDirectoryName($destino)) ".$nome.$([guid]::NewGuid().ToString('N')).tmp"
    try {
        $fluxo = [System.IO.File]::Open($tmp, [System.IO.FileMode]::CreateNew)
        try {
            $bytes = [System.Text.UTF8Encoding]::new($false).GetBytes($Value)
            $fluxo.Write($bytes, 0, $bytes.Length)
            $fluxo.Flush($true)  # os bytes chegam ao disco antes da troca
        }
        finally { $fluxo.Dispose() }
        if (Test-Path -LiteralPath $destino) {
            [System.IO.File]::Replace($tmp, $destino, [NullString]::Value)
        }
        else {
            [System.IO.File]::Move($tmp, $destino)
        }
    }
    catch {
        Remove-Item -LiteralPath $tmp -Force -ErrorAction SilentlyContinue
        throw
    }
}
'''

