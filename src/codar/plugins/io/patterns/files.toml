[[pattern]]
id = "io.find_files"
title = "Listar arquivos recursivamente por extensão"
keywords = "listar buscar procurar encontrar arquivos recursivamente recursivo pasta diretorio subpastas extensao ignorar node_modules git walk glob"
require = ["recursivamente", "recursivo", "recursiva", "recursive", "recursively", "extensao", "extension", "subpastas", "walk"]
tags = ["io", "performance"]

[pattern.code]
python = '''
import os
from collections.abc import Iterator
from pathlib import Path

IGNORAR = frozenset({".git", "node_modules", "__pycache__", ".venv", "venv", "dist", "build"})


def arquivos(raiz: str | Path, extensoes: tuple[str, ...] = (), ignorar: frozenset[str] = IGNORAR) -> Iterator[Path]:
    """Arquivos sob `raiz`, filtrando por extensão (".py", ".md"; vazio = todos, sem diferenciar maiúsculas) e sem
    entrar em node_modules, .git e afins: a poda acontece antes de descer na pasta, o que poupa muito tempo."""
    exts = tuple(e.lower() for e in extensoes)
    for pasta, subpastas, nomes in os.walk(raiz):
        subpastas[:] = sorted(d for d in subpastas if d not in ignorar)
        for nome in sorted(nomes):
            if not exts or nome.lower().endswith(exts):
                yield Path(pasta, nome)
'''
javascript = '''
import { readdir } from "node:fs/promises";
import { extname, join } from "node:path";

const IGNORAR = new Set([".git", "node_modules", "__pycache__", ".venv", "venv", "dist", "build"]);

/** Arquivos sob `raiz`, filtrando por extensão (sem diferenciar maiúsculas) e sem entrar em node_modules e .git. */
export async function* arquivos(raiz, extensoes = [], ignorar = IGNORAR) {
  const exts = extensoes.map((e) => e.toLowerCase());
  const pilha = [raiz];
  while (pilha.length) {
    const pasta = pilha.pop();
    let entradas;
    try {
      entradas = await readdir(pasta, { withFileTypes: true });
    } catch {
      continue; // sem permissão: segue em frente
    }
    for (const e of entradas) {
      const caminho = join(pasta, e.name);
      if (e.isDirectory()) {
        if (!ignorar.has(e.name)) pilha.push(caminho);
      } else if (e.isFile() && (!exts.length || exts.includes(extname(e.name).toLowerCase()))) {
        yield caminho;
      }
    }
  }
}
'''
go = '''
package main

import (
	"io/fs"
	"path/filepath"
	"strings"
)

var ignorar = map[string]bool{
	".git": true, "node_modules": true, "__pycache__": true, ".venv": true, "venv": true, "dist": true, "build": true,
}

// Arquivos lista os arquivos sob raiz com uma das extensões (".go", ".md"; nenhuma = todos), sem entrar em
// node_modules, .git e afins: fs.SkipDir poda a pasta inteira.
func Arquivos(raiz string, extensoes ...string) ([]string, error) {
	var out []string
	err := filepath.WalkDir(raiz, func(caminho string, d fs.DirEntry, err error) error {
		if err != nil {
			return nil // sem permissão: segue em frente
		}
		if d.IsDir() {
			if caminho != raiz && ignorar[d.Name()] {
				return fs.SkipDir
			}
			return nil
		}
		ext := strings.ToLower(filepath.Ext(d.Name()))
		if len(extensoes) == 0 {
			out = append(out, caminho)
			return nil
		}
		for _, e := range extensoes {
			if ext == strings.ToLower(e) {
				out = append(out, caminho)
				break
			}
		}
		return nil
	})
	return out, err
}
'''
bash = '''
# listar_arquivos PASTA [EXT...]: arquivos com as extensões (sem o ponto, sem diferenciar maiúsculas), sem entrar em
# node_modules, .git e afins (-prune corta a pasta inteira).
listar_arquivos() {
  local raiz="$1" e
  shift
  local poda=(-type d \( -name .git -o -name node_modules -o -name __pycache__ -o -name .venv -o -name venv
    -o -name dist -o -name build \) -prune)
  if (($# == 0)); then
    find "$raiz" "${poda[@]}" -o -type f -print 2>/dev/null
    return
  fi
  local filtro=()
  for e in "$@"; do
    ((${#filtro[@]})) && filtro+=(-o)
    filtro+=(-iname "*.$e")
  done
  find "$raiz" "${poda[@]}" -o -type f \( "${filtro[@]}" \) -print 2>/dev/null
}
'''
powershell = '''
function Find-Arquivo {
    <#
    .SYNOPSIS
    Arquivos sob -Path com as extensões dadas (sem diferenciar maiúsculas), sem entrar em node_modules, .git e afins.
    Get-ChildItem -Recurse -Exclude não serve: ele filtra o resultado, mas continua descendo nas pastas excluídas.
    #>
    [CmdletBinding()]
    param(
        [Parameter(Mandatory)][string]$Path,
        [string[]]$Extensao = @(),
        [string[]]$Ignorar = @('.git', 'node_modules', '__pycache__', '.venv', 'venv', 'dist', 'build')
    )
    $exts = @($Extensao | ForEach-Object { '.' + $_.TrimStart('.').ToLowerInvariant() })
    $pilha = [System.Collections.Generic.Stack[System.IO.DirectoryInfo]]::new()
    $pilha.Push([System.IO.DirectoryInfo]::new($PSCmdlet.GetUnresolvedProviderPathFromPSPath($Path)))
    while ($pilha.Count) {
        $pasta = $pilha.Pop()
        try { $itens = $pasta.GetFileSystemInfos() } catch { continue }  # sem permissão: segue em frente
        foreach ($item in $itens) {
            if ($item -is [System.IO.DirectoryInfo]) {
                $link = $item.Attributes -band [System.IO.FileAttributes]::ReparsePoint
                if ($Ignorar -notcontains $item.Name -and -not $link) { $pilha.Push($item) }
            }
            elseif ($exts.Count -eq 0 -or $exts -contains $item.Extension.ToLowerInvariant()) {
                $item.FullName
            }
        }
    }
}
'''

