[[pattern]]
id = "io.read_lines"
title = "Ler arquivo grande linha por linha"
keywords = "ler arquivo grande linha por linha linhas stream streaming sem carregar memoria log contar ocorrencias"
require = ["linha", "line", "streaming", "stream"]
tags = ["io", "performance"]

[pattern.code]
python = '''
from collections.abc import Iterator
from pathlib import Path


def linhas(caminho: str | Path, encoding: str = "utf-8") -> Iterator[str]:
    """Uma linha por vez, sem o fim de linha e sem carregar o arquivo inteiro na memória (serve para arquivos de
    vários GB). errors="replace" evita que um byte inválido no meio do arquivo derrube a leitura."""
    with open(caminho, encoding=encoding, errors="replace", newline="") as f:
        for linha in f:
            yield linha.rstrip("\r\n")


def contar_ocorrencias(caminho: str | Path, termo: str) -> int:
    return sum(1 for linha in linhas(caminho) if termo in linha)
'''
javascript = '''
import { createReadStream } from "node:fs";
import { createInterface } from "node:readline";

/** Uma linha por vez, sem carregar o arquivo inteiro na memória (crlfDelay: \r\n conta como uma quebra só). */
export async function* linhas(caminho) {
  const rl = createInterface({ input: createReadStream(caminho, { encoding: "utf8" }), crlfDelay: Infinity });
  try {
    for await (const linha of rl) yield linha;
  } finally {
    rl.close();
  }
}

export async function contarOcorrencias(caminho, termo) {
  let n = 0;
  for await (const linha of linhas(caminho)) if (linha.includes(termo)) n++;
  return n;
}
'''
go = '''
package main

import (
	"bufio"
	"os"
	"strings"
)

// ContarOcorrencias lê uma linha por vez (bufio.Scanner), sem carregar o arquivo inteiro na memória.
func ContarOcorrencias(caminho, termo string) (int, error) {
	f, err := os.Open(caminho)
	if err != nil {
		return 0, err
	}
	defer f.Close()
	sc := bufio.NewScanner(f)
	sc.Buffer(make([]byte, 64*1024), 16*1024*1024) // linhas de até 16 MB (o padrão desiste em 64 KB)
	n := 0
	for sc.Scan() {
		if strings.Contains(sc.Text(), termo) {
			n++
		}
	}
	return n, sc.Err()
}
'''
bash = '''
# contar_ocorrencias ARQUIVO TERMO: lê uma linha por vez; "|| [[ -n $linha ]]" não perde a última linha sem \n.
# Só para contar, `grep -cF -- "$termo" "$arquivo"` é bem mais rápido; o laço serve quando cada linha é processada.
contar_ocorrencias() {
  local arquivo="$1" termo="$2" linha n=0
  while IFS= read -r linha || [[ -n "$linha" ]]; do
    [[ "$linha" == *"$termo"* ]] && ((n += 1))
  done < "$arquivo"
  echo "$n"
}
'''
powershell = '''
function Measure-Ocorrencia {
    <#
    .SYNOPSIS
    Conta as linhas que contêm um termo lendo uma linha por vez ([IO.File]::ReadLines). Em arquivos grandes,
    Get-Content é lento e cria um objeto por linha.
    #>
    [CmdletBinding()]
    param(
        [Parameter(Mandatory)][string]$Path,
        [Parameter(Mandatory)][string]$Termo
    )
    $n = 0
    foreach ($linha in [System.IO.File]::ReadLines($PSCmdlet.GetUnresolvedProviderPathFromPSPath($Path))) {
        if ($linha.Contains($Termo)) { $n++ }
    }
    $n
}
'''

