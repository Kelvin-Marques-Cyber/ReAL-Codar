rust = '''
use std::io::{self, BufRead, Write};

fn calcular(a: f64, op: &str, b: f64) -> Result<f64, String> {
    let r = match op {
        "/" | "%" if b == 0.0 => return Err("divisão por zero".into()),
        "^" | "**" if a == 0.0 && b < 0.0 => return Err("divisão por zero".into()),
        "+" => a + b,
        "-" => a - b,
        "*" => a * b,
        "/" => a / b,
        "%" => a % b,
        "^" | "**" => a.powf(b),
        _ => return Err(format!("operador inválido: {op}")),
    };
    if r.is_nan() {
        Err("resultado não é um número real".into())
    } else if r.is_infinite() {
        Err("resultado grande demais".into())
    } else {
        Ok(r)
    }
}

/// "2,5 * 4" -> (2.5, "*", 4.0). O operador é o primeiro símbolo depois do primeiro dígito: "-2 - -3".
fn interpretar(linha: &str) -> Result<(f64, &str, f64), String> {
    let erro = || "digite uma conta como 2 + 3".to_string();
    let texto = linha.trim();
    let inicio = texto.find(|c: char| c.is_ascii_digit()).ok_or_else(erro)?;
    let pos = inicio + texto[inicio..].find(|c: char| "+-*/%^".contains(c)).ok_or_else(erro)?;
    let tam = if texto[pos..].starts_with("**") { 2 } else { 1 };
    let numero = |s: &str| s.trim().replace(',', ".").parse::<f64>().map_err(|_| erro());
    Ok((numero(&texto[..pos])?, &texto[pos..pos + tam], numero(&texto[pos + tam..])?))
}

/// Até 10 casas decimais, sem zeros sobrando: 0.1 + 0.2 -> 0.3
fn formatar(r: f64) -> String {
    let s = format!("{r:.10}");
    let s = s.trim_end_matches('0').trim_end_matches('.');
    if s == "-0" { "0".to_string() } else { s.to_string() }
}

fn main() {
    println!("Calculadora — digite uma conta como 2 + 3 (operadores: + - * / % ^; q para sair)");
    let mut linhas = io::stdin().lock().lines();
    loop {
        print!("> ");
        io::stdout().flush().ok();
        let Some(Ok(linha)) = linhas.next() else {
            println!(); // fim da entrada (Ctrl+D)
            break;
        };
        let linha = linha.trim();
        if ["q", "sair", "exit"].contains(&linha.to_lowercase().as_str()) {
            break;
        }
        if linha.is_empty() {
            continue;
        }
        match interpretar(linha).and_then(|(a, op, b)| calcular(a, op, b)) {
            Ok(r) => println!("= {}", formatar(r)),
            Err(e) => println!("Erro: {e}"),
        }
    }
}
