csharp = '''
using System.Globalization;
using System.Text.RegularExpressions;

var operacoes = new Dictionary<string, Func<double, double, double>>
{
    ["+"] = (a, b) => a + b,
    ["-"] = (a, b) => a - b,
    ["*"] = (a, b) => a * b,
    ["/"] = (a, b) => a / b,
    ["%"] = (a, b) => a % b,
    ["^"] = Math.Pow,
    ["**"] = Math.Pow,
};
// Uma operação por linha: "2 + 3", "-1,5 * 4", "2 ^ 10" (vírgula ou ponto decimal).
var conta = new Regex(@"^\s*([-+]?[0-9]*[.,]?[0-9]+)\s*(\*\*|[-+*/%^])\s*([-+]?[0-9]*[.,]?[0-9]+)\s*$");

double Calcular(double a, string op, double b)
{
    if (!operacoes.TryGetValue(op, out var fn))
    {
        throw new ArgumentException($"operador inválido: {op}");
    }
    if (((op is "/" or "%") && b == 0) || ((op is "^" or "**") && a == 0 && b < 0))
    {
        throw new ArgumentException("divisão por zero");
    }
    var r = fn(a, b);
    if (double.IsNaN(r))
    {
        throw new ArgumentException("resultado não é um número real");
    }
    if (double.IsInfinity(r))
    {
        throw new ArgumentException("resultado grande demais");
    }
    return r + 0.0; // -0 vira 0
}

double Avaliar(string linha)
{
    var m = conta.Match(linha);
    if (!m.Success)
    {
        throw new ArgumentException("digite uma conta como 2 + 3");
    }
    double Numero(string s) => double.Parse(s.Replace(',', '.'), NumberStyles.Float, CultureInfo.InvariantCulture);
    return Calcular(Numero(m.Groups[1].Value), m.Groups[2].Value, Numero(m.Groups[3].Value));
}

Console.WriteLine("Calculadora — digite uma conta como 2 + 3 (operadores: + - * / % ^; q para sair)");
while (true)
{
    Console.Write("> ");
    var linha = Console.ReadLine()?.Trim();
    if (linha is null) // fim da entrada (Ctrl+D / Ctrl+Z)
    {
        Console.WriteLine();
        break;
    }
    if (linha.ToLowerInvariant() is "q" or "sair" or "exit")
    {
        break;
    }
    if (linha.Length == 0)
    {
        continue;
    }
    try
    {
        Console.WriteLine($"= {Avaliar(linha).ToString("G12", CultureInfo.InvariantCulture)}");
    }
    catch (ArgumentException e)
    {
        Console.WriteLine($"Erro: {e.Message}");
    }
}
