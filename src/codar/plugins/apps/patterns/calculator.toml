[[pattern]]
id = "algo.safe_eval"
title = "Avaliar expressão matemática sem eval"
keywords = "avaliar expressao matematica segura parser calculadora expression evaluate safe sem eval shunting yard"
require = ["expressao", "expression"]
tags = ["security", "parser", "best-practice"]

[pattern.code]
python = '''
import ast
import math
import operator

_BINARIOS = {
    ast.Add: operator.add,
    ast.Sub: operator.sub,
    ast.Mult: operator.mul,
    ast.Div: operator.truediv,
    ast.Mod: operator.mod,
    ast.Pow: operator.pow,
}
_UNARIOS = {ast.USub: operator.neg, ast.UAdd: operator.pos}


def avaliar(expressao: str) -> float:
    """Avalia + - * / % ** (ou ^) e parênteses sem executar código arbitrário (nada de eval).

    Tudo é calculado em float: com inteiros, algo curto como ((9**99)**99)**99 travaria o processo.
    Levanta ValueError para entrada inválida, divisão por zero ou resultado fora dos reais.
    """
    if len(expressao) > 200:
        raise ValueError("expressão longa demais")
    try:
        arvore = ast.parse(expressao.replace("^", "**"), mode="eval")
    except SyntaxError:
        raise ValueError("expressão malformada") from None

    def visitar(no: ast.AST) -> float:
        if isinstance(no, ast.Expression):
            return visitar(no.body)
        if isinstance(no, ast.Constant) and type(no.value) in (int, float):  # True/False não são números aqui
            return float(no.value)
        if isinstance(no, ast.BinOp) and type(no.op) in _BINARIOS:
            resultado = _BINARIOS[type(no.op)](visitar(no.left), visitar(no.right))
            if isinstance(resultado, complex):  # (-8) ** 0.5
                raise ValueError("resultado não é um número real")
            return resultado
        if isinstance(no, ast.UnaryOp) and type(no.op) in _UNARIOS:
            return _UNARIOS[type(no.op)](visitar(no.operand))
        raise ValueError(f"elemento não permitido: {type(no).__name__}")

    try:
        resultado = visitar(arvore)
    except ZeroDivisionError:
        raise ValueError("divisão por zero") from None
    except OverflowError:
        raise ValueError("resultado grande demais") from None
    if not math.isfinite(resultado):
        raise ValueError("resultado grande demais")
    return resultado
'''
javascript = '''
// Avaliador de expressões (+ - * / % ^ ou ** e parênteses) com shunting-yard: sem eval nem new Function.
// "neg" é o menos unário: abaixo de ^ (-2^2 = -4, como na matemática) e acima de * e / (2 * -3 = -6).
const PRECEDENCIA = { "+": 1, "-": 1, "*": 2, "/": 2, "%": 2, neg: 2.5, "^": 3 };
const APLICAR = {
  "+": (a, b) => a + b,
  "-": (a, b) => a - b,
  "*": (a, b) => a * b,
  "/": (a, b) => {
    if (b === 0) throw new Error("divisão por zero");
    return a / b;
  },
  "%": (a, b) => {
    if (b === 0) throw new Error("divisão por zero");
    return a % b;
  },
  "^": (a, b) => {
    if (a === 0 && b < 0) throw new Error("divisão por zero");
    return a ** b;
  },
};

export function avaliar(expressao) {
  if (expressao.length > 200) throw new Error("expressão longa demais");
  const tokens = expressao.match(/\d+(?:\.\d+)?|\*\*|[-+*/%^()]/g) ?? [];
  if (tokens.join("") !== expressao.replace(/\s+/g, "")) throw new Error("caractere inválido na expressão");
  const saida = [];
  const ops = [];
  const reduzir = () => {
    const op = ops.pop();
    const b = saida.pop();
    if (b === undefined) throw new Error("expressão malformada");
    if (op === "neg") {
      saida.push(-b);
      return;
    }
    const a = saida.pop();
    if (a === undefined) throw new Error("expressão malformada");
    saida.push(APLICAR[op](a, b));
  };
  let anterior = null;
  for (const token of tokens) {
    const t = token === "**" ? "^" : token;
    if (/^\d/.test(t)) {
      saida.push(Number(t));
    } else if (t === "(") {
      ops.push(t);
    } else if (t === ")") {
      while (ops.length && ops.at(-1) !== "(") reduzir();
      if (ops.pop() !== "(") throw new Error("parênteses desbalanceados");
    } else if (t === "-" && (anterior === null || anterior === "(" || Object.hasOwn(PRECEDENCIA, anterior))) {
      ops.push("neg"); // operador prefixo: entra na pilha sem desempilhar nada
    } else {
      // ^ é associativo à direita (2^3^2 = 2^9); os demais, à esquerda
      while (ops.length && ops.at(-1) !== "(" &&
        (PRECEDENCIA[ops.at(-1)] > PRECEDENCIA[t] || (PRECEDENCIA[ops.at(-1)] === PRECEDENCIA[t] && t !== "^"))) {
        reduzir();
      }
      ops.push(t);
    }
    anterior = t;
  }
  while (ops.length) {
    if (ops.at(-1) === "(") throw new Error("parênteses desbalanceados");
    reduzir();
  }
  if (saida.length !== 1) throw new Error("expressão malformada");
  const r = saida[0];
  if (Number.isNaN(r)) throw new Error("resultado não é um número real");
  if (!Number.isFinite(r)) throw new Error("resultado grande demais");
  return r;
}
'''

[pattern.test]
python = '''
assert avaliar("2 + 3 * 4") == 14
assert avaliar("(2 + 3) * 4") == 20
assert avaliar("2 * -3") == -6
assert avaliar("-2 ** 2") == -4
assert avaliar("2 ^ 10") == 1024
assert avaliar("2 ** 3 ** 2") == 512
assert avaliar("7 % 3") == 1
for ruim in ["1 / 0", "0 ** -1", "(-8) ** 0.5", "(-8) ** 0.5 % 2", "__import__('os')", "1 +", "True + 1",
             "9 ** 99 ** 99", "((9 ** 99) ** 99) ** 99", "2" * 201, "abc", "[1]", "x.y"]:
    try:
        avaliar(ruim)
    except ValueError:
        pass
    else:
        raise AssertionError(f"deveria falhar: {ruim}")
'''
javascript = '''
const confere = (expr, esperado) => {
  const r = avaliar(expr);
  if (r !== esperado) throw new Error(`${expr} = ${r}, esperado ${esperado}`);
};
confere("2 + 3 * 4", 14);
confere("(2 + 3) * 4", 20);
confere("2 * -3", -6);
confere("-2 ^ 2", -4);
confere("2 ** 10", 1024);
confere("2 ^ 3 ^ 2", 512);
confere("2 ^ -1", 0.5);
confere("--3", 3);
confere("7 % 3", 1);
for (const ruim of ["1 / 0", "0 ^ -1", "(-8) ^ 0.5", "1 +", "(1", "1)", "abc", "2; process.exit(1)", "1 2",
  "2".repeat(201)]) {
  let falhou = false;
  try {
    avaliar(ruim);
  } catch {
    falhou = true;
  }
  if (!falhou) throw new Error(`deveria falhar: ${ruim}`);
}
'''
