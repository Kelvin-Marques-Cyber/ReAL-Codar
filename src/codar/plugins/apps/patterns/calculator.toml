go = '''
package main

import (
	"bufio"
	"errors"
	"fmt"
	"math"
	"os"
	"regexp"
	"strconv"
	"strings"
)

// Uma operação por linha: "2 + 3", "-1,5 * 4", "2 ^ 10" (vírgula ou ponto decimal).
var conta = regexp.MustCompile(`^\s*([-+]?\d*[.,]?\d+)\s*(\*\*|[-+*/%^])\s*([-+]?\d*[.,]?\d+)\s*$`)

var operacoes = map[string]func(a, b float64) float64{
	"+":  func(a, b float64) float64 { return a + b },
	"-":  func(a, b float64) float64 { return a - b },
	"*":  func(a, b float64) float64 { return a * b },
	"/":  func(a, b float64) float64 { return a / b },
	"%":  math.Mod,
	"^":  math.Pow,
	"**": math.Pow,
}

func calcular(a float64, op string, b float64) (float64, error) {
	fn, ok := operacoes[op]
	if !ok {
		return 0, fmt.Errorf("operador inválido: %q", op)
	}
	potencia := op == "^" || op == "**"
	if ((op == "/" || op == "%") && b == 0) || (potencia && a == 0 && b < 0) {
		return 0, errors.New("divisão por zero")
	}
	r := fn(a, b)
	if math.IsNaN(r) {
		return 0, errors.New("resultado não é um número real")
	}
	if math.IsInf(r, 0) {
		return 0, errors.New("resultado grande demais")
	}
	return r + 0, nil // -0 vira 0
}

func avaliar(linha string) (float64, error) {
	m := conta.FindStringSubmatch(linha)
	if m == nil {
		return 0, errors.New("digite uma conta como 2 + 3")
	}
	a, errA := strconv.ParseFloat(strings.Replace(m[1], ",", ".", 1), 64)
	b, errB := strconv.ParseFloat(strings.Replace(m[3], ",", ".", 1), 64)
	if err := errors.Join(errA, errB); err != nil {
		return 0, err
	}
	return calcular(a, m[2], b)
}

func main() {
	fmt.Println("Calculadora — digite uma conta como 2 + 3 (operadores: + - * / % ^; q para sair)")
	entrada := bufio.NewScanner(os.Stdin)
	for {
		fmt.Print("> ")
		if !entrada.Scan() { // fim da entrada (Ctrl+D)
			fmt.Println()
			return
		}
		linha := strings.TrimSpace(entrada.Text())
		if l := strings.ToLower(linha); l == "q" || l == "sair" || l == "exit" {
			return
		}
		if linha == "" {
			continue
		}
		r, err := avaliar(linha)
		if err != nil {
			fmt.Println("Erro:", err)
			continue
		}
		fmt.Println("=", strconv.FormatFloat(r, 'g', 12, 64))
	}
}
