java = '''
import java.math.BigDecimal;
import java.math.MathContext;
import java.util.Map;
import java.util.Scanner;
import java.util.function.DoubleBinaryOperator;
import java.util.regex.Matcher;
import java.util.regex.Pattern;

public class Calculadora {
    private static final Map<String, DoubleBinaryOperator> OPERACOES = Map.of(
        "+", (a, b) -> a + b,
        "-", (a, b) -> a - b,
        "*", (a, b) -> a * b,
        "/", (a, b) -> a / b,
        "%", (a, b) -> a % b,
        "^", Math::pow,
        "**", Math::pow
    );
    // Uma operação por linha: "2 + 3", "-1,5 * 4", "2 ^ 10" (vírgula ou ponto decimal).
    private static final Pattern CONTA =
        Pattern.compile("\\s*([-+]?\\d*[.,]?\\d+)\\s*(\\*\\*|[-+*/%^])\\s*([-+]?\\d*[.,]?\\d+)\\s*");

    static double calcular(double a, String op, double b) {
        DoubleBinaryOperator fn = OPERACOES.get(op);
        if (fn == null) {
            throw new IllegalArgumentException("operador inválido: " + op);
        }
        boolean potencia = op.equals("^") || op.equals("**");
        if (((op.equals("/") || op.equals("%")) && b == 0) || (potencia && a == 0 && b < 0)) {
            throw new IllegalArgumentException("divisão por zero");
        }
        double r = fn.applyAsDouble(a, b);
        if (Double.isNaN(r)) {
            throw new IllegalArgumentException("resultado não é um número real");
        }
        if (Double.isInfinite(r)) {
            throw new IllegalArgumentException("resultado grande demais");
        }
        return r;
    }

    static double avaliar(String linha) {
        Matcher m = CONTA.matcher(linha);
        if (!m.matches()) {
            throw new IllegalArgumentException("digite uma conta como 2 + 3");
        }
        double a = Double.parseDouble(m.group(1).replace(',', '.'));
        double b = Double.parseDouble(m.group(3).replace(',', '.'));
        return calcular(a, m.group(2), b);
    }

    /** 12 algarismos significativos, sem notação científica: 0.1 + 0.2 -> 0.3 */
    static String formatar(double r) {
        return BigDecimal.valueOf(r).round(new MathContext(12)).stripTrailingZeros().toPlainString();
    }

    public static void main(String[] args) {
        System.out.println("Calculadora — digite uma conta como 2 + 3 (operadores: + - * / % ^; q para sair)");
        try (Scanner sc = new Scanner(System.in)) {
            while (true) {
                System.out.print("> ");
                if (!sc.hasNextLine()) { // fim da entrada (Ctrl+D)
                    System.out.println();
                    break;
                }
                String linha = sc.nextLine().trim();
                if (linha.equalsIgnoreCase("q") || linha.equalsIgnoreCase("sair") || linha.equalsIgnoreCase("exit")) {
                    break;
                }
                if (linha.isEmpty()) {
                    continue;
                }
                try {
                    System.out.println("= " + formatar(avaliar(linha)));
                } catch (IllegalArgumentException e) {
                    System.out.println("Erro: " + e.getMessage());
                }
            }
        }
    }
}
