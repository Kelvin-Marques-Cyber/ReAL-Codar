bash = '''
#!/usr/bin/env bash
set -euo pipefail

# Uma operação por linha: "2 + 3", "-1,5 * 4", "2 ^ 10". As contas usam awk, que vem em qualquer Linux
# (o bc não vem instalado em imagens mínimas como o Ubuntu Server).
readonly NUM='[-+]?[0-9]*[.,]?[0-9]+'

calcular() {
  local a="$1" op="$2" b="$3"
  if [[ "$op" == '**' ]]; then
    op='^'
  fi
  case "$op" in
    +|-|'*'|/|%|^) ;;
    *) echo "operador inválido: $op"; return 1 ;;
  esac
  awk -v a="$a" -v op="$op" -v b="$b" 'BEGIN {
    if (((op == "/" || op == "%") && b == 0) || (op == "^" && a == 0 && b < 0)) { print "divisão por zero"; exit 1 }
    if (op == "^" && a < 0 && b != int(b)) { print "resultado não é um número real"; exit 1 }
    r = op == "+" ? a + b : op == "-" ? a - b : op == "*" ? a * b : op == "/" ? a / b : op == "%" ? a % b : a ^ b
    if (r > 1.7976931348623157e308 || r < -1.7976931348623157e308) { print "resultado grande demais"; exit 1 }
    printf "%.12g\n", r + 0
  }'
}

echo "Calculadora — digite uma conta como 2 + 3 (operadores: + - * / % ^; q para sair)"
while IFS= read -rp "> " linha; do
  linha="${linha//[[:space:]]/}"  # "2 + 3" -> "2+3"
  case "${linha,,}" in
    q|sair|exit) break ;;
    '') continue ;;
  esac
  if [[ "$linha" =~ ^($NUM)(\*\*|[-+*/%^])($NUM)$ ]]; then
    a="${BASH_REMATCH[1]//,/.}" op="${BASH_REMATCH[2]}" b="${BASH_REMATCH[3]//,/.}"
    if resultado="$(calcular "$a" "$op" "$b")"; then
      echo "= $resultado"
    else
      echo "Erro: $resultado"
    fi
  else
    echo "Erro: digite uma conta como 2 + 3"
  fi
done
'''

