# Calculadora com boas práticas: sem eval, tabela de despacho, validação de entrada,
# divisão por zero, estouro e raiz de negativo tratados, Ctrl+D sem traceback, lógica (calcular) separada
# da interface (main) para ser testável. Entrada natural: a conta inteira numa linha ("2 + 3").

[[pattern]]
id = "app.calculator"
title = "Calculadora interativa"
keywords = "calculadora calculator calcular operacoes aritmeticas somar subtrair multiplicar dividir"
require = ["calculadora"]
tags = ["app", "best-practice", "cli"]

[pattern.code]
python = '''
import math
import operator
import re

OPERACOES = {
    "+": operator.add,
    "-": operator.sub,
    "*": operator.mul,
    "/": operator.truediv,
    "%": operator.mod,
    "^": operator.pow,
    "**": operator.pow,
}
# Uma operação por linha: "2 + 3", "-1,5 * 4", "2 ^ 10" (vírgula ou ponto decimal).
CONTA = re.compile(r"\s*([-+]?\d*[.,]?\d+)\s*(\*\*|[-+*/%^])\s*([-+]?\d*[.,]?\d+)\s*")


def calcular(a: float, op: str, b: float) -> float:
    """Aplica a operação; ValueError para operador inválido, divisão por zero ou resultado fora dos reais."""
    if op not in OPERACOES:
        raise ValueError(f"operador inválido: {op!r}")
    if (op in ("/", "%") and b == 0) or (op in ("^", "**") and a == 0 and b < 0):
        raise ValueError("divisão por zero")
    try:
        resultado = OPERACOES[op](a, b)
    except OverflowError:  # 10 ^ 400
        raise ValueError("resultado grande demais") from None
    if isinstance(resultado, complex):  # (-8) ^ 0.5
        raise ValueError("resultado não é um número real")
    if not math.isfinite(resultado):
        raise ValueError("resultado grande demais")
    return resultado + 0.0  # -0.0 vira 0.0


def interpretar(linha: str) -> tuple[float, str, float]:
    """'2,5 * 4' -> (2.5, '*', 4.0); ValueError se a linha não for uma conta."""
    m = CONTA.fullmatch(linha)
    if m is None:
        raise ValueError("digite uma conta como 2 + 3")
    a, op, b = m.groups()
    return float(a.replace(",", ".")), op, float(b.replace(",", "."))


def main() -> None:
    print("Calculadora — digite uma conta como 2 + 3 (operadores: + - * / % ^; q para sair)")
    while True:
        try:
            linha = input("> ").strip()
        except (EOFError, KeyboardInterrupt):  # Ctrl+D / Ctrl+C encerram sem traceback
            print()
            break
        if linha.lower() in ("q", "sair", "exit"):
            break
        if not linha:
            continue
        try:
            print(f"= {calcular(*interpretar(linha)):.12g}")
        except ValueError as erro:
            print(f"Erro: {erro}")


if __name__ == "__main__":
    main()
'''
javascript = '''
import * as readline from "node:readline";

const OPERACOES = {
  "+": (a, b) => a + b,
  "-": (a, b) => a - b,
  "*": (a, b) => a * b,
  "/": (a, b) => a / b,
  "%": (a, b) => a % b,
  "^": (a, b) => a ** b,
  "**": (a, b) => a ** b,
};
// Uma operação por linha: "2 + 3", "-1,5 * 4", "2 ^ 10" (vírgula ou ponto decimal).
const CONTA = /^\s*([-+]?\d*[.,]?\d+)\s*(\*\*|[-+*/%^])\s*([-+]?\d*[.,]?\d+)\s*$/;

export function calcular(a, op, b) {
  // Object.hasOwn evita que "constructor" ou "toString" sejam aceitos como operadores.
  if (!Object.hasOwn(OPERACOES, op)) throw new Error(`operador inválido: ${op}`);
  const potencia = op === "^" || op === "**";
  if (((op === "/" || op === "%") && b === 0) || (potencia && a === 0 && b < 0)) {
    throw new Error("divisão por zero");
  }
  const r = OPERACOES[op](a, b);
  if (Number.isNaN(r)) throw new Error("resultado não é um número real");
  if (!Number.isFinite(r)) throw new Error("resultado grande demais");
  return r;
}

export function interpretar(linha) {
  const m = CONTA.exec(linha);
  if (!m) throw new Error("digite uma conta como 2 + 3");
  return [Number(m[1].replace(",", ".")), m[2], Number(m[3].replace(",", "."))];
}

// 12 algarismos significativos: 0.1 + 0.2 -> 0.3
const formatar = (n) => String(Number(n.toPrecision(12)));

const rl = readline.createInterface({ input: process.stdin, output: process.stdout, prompt: "> " });
console.log("Calculadora — digite uma conta como 2 + 3 (operadores: + - * / % ^; q para sair)");
rl.prompt();
for await (const bruta of rl) {
  const linha = bruta.trim();
  if (["q", "sair", "exit"].includes(linha.toLowerCase())) break;
  if (linha) {
    try {
      console.log(`= ${formatar(calcular(...interpretar(linha)))}`);
    } catch (err) {
      console.log(`Erro: ${err.message}`);
    }
  }
  rl.prompt();
}
rl.close();
