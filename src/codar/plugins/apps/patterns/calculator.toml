$Operacoes = @{
    '+'  = { param($a, $b) $a + $b }
    '-'  = { param($a, $b) $a - $b }
    '*'  = { param($a, $b) $a * $b }
    '/'  = { param($a, $b) $a / $b }
    '%'  = { param($a, $b) $a % $b }
    '^'  = { param($a, $b) [math]::Pow($a, $b) }
    '**' = { param($a, $b) [math]::Pow($a, $b) }
}
# Uma operação por linha: "2 + 3", "-1,5 * 4", "2 ^ 10" (vírgula ou ponto decimal).
$PadraoConta = '^\s*([-+]?[0-9]*[.,]?[0-9]+)\s*(\*\*|[-+*/%^])\s*([-+]?[0-9]*[.,]?[0-9]+)\s*$'
$Cultura = [cultureinfo]::InvariantCulture

function Invoke-Calculo {
    [CmdletBinding()]
    param(
        [Parameter(Mandatory)][double]$A,
        [Parameter(Mandatory)][string]$Operador,
        [Parameter(Mandatory)][double]$B
    )
    if (-not $Operacoes.ContainsKey($Operador)) {
        throw "operador inválido: $Operador"
    }
    if ((($Operador -in '/', '%') -and $B -eq 0) -or (($Operador -in '^', '**') -and $A -eq 0 -and $B -lt 0)) {
        throw 'divisão por zero'
    }
    $r = [double](& $Operacoes[$Operador] $A $B)
    if ([double]::IsNaN($r)) { throw 'resultado não é um número real' }
    if ([double]::IsInfinity($r)) { throw 'resultado grande demais' }
    $r + 0.0  # -0 vira 0
}

function ConvertFrom-Conta {
    param([Parameter(Mandatory)][string]$Linha)
    if (-not ($Linha -match $PadraoConta)) {
        throw 'digite uma conta como 2 + 3'
    }
    [pscustomobject]@{
        A        = [double]::Parse($Matches[1].Replace(',', '.'), $Cultura)
        Operador = $Matches[2]
        B        = [double]::Parse($Matches[3].Replace(',', '.'), $Cultura)
    }
}

Write-Output 'Calculadora — digite uma conta como 2 + 3 (operadores: + - * / % ^; q para sair)'
while ($true) {
    [Console]::Write('> ')
    $linha = [Console]::In.ReadLine()  # $null no fim da entrada (Ctrl+D / Ctrl+Z)
    if ($null -eq $linha) {
        Write-Output ''
        break
    }
    $linha = $linha.Trim()
    if ($linha -in 'q', 'sair', 'exit') { break }
    if (-not $linha) { continue }
    try {
        $conta = ConvertFrom-Conta -Linha $linha
        $r = Invoke-Calculo -A $conta.A -Operador $conta.Operador -B $conta.B
        Write-Output "= $($r.ToString('G12', $Cultura))"
    }
    catch {
        Write-Output "Erro: $($_.Exception.Message)"
    }
}
